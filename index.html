"subsets","difficulty":"medium","category":"回溯","tags":["回溯","位运算"],"summary":"每个元素只有选或不选。从 start 向后选，才能避免同一子集的不同顺序。","description":["给定一个不含重复元素的整数数组 nums，返回该数组所有可能的子集。答案不能包含重复子集，顺序不限。","空集也要包含在答案里。"],"examples":[{"input":"nums = [1,2,3]","output":"[[],[1],[2],[1,2],[3],[1,3],[2,3],[1,2,3]]"},{"input":"nums = [0]","output":"[[],[0]]"}],"constraints":["1 \u003c= nums.length \u003c= 10","-10 \u003c= nums[i] \u003c= 10","nums 中的元素互不相同"],"essence":[{"title":"每个节点都是答案","body":"排列要到叶子才收集。子集在进入每一层时就可以收集当前 path，包括空 path。"},{"title":"start 保证组合","body":"下一层只能选 start 及其右边的数，[1,2] 不会再生成 [2,1]。"},{"title":"复杂度","body":"子集共 2^n 个，总时间 O(n·2^n)。"}],"solution":["回溯函数带着下一个可选位置 start。每次调用先把当前 path 的副本放入答案。","然后从 start 到末尾枚举，把 nums[i] 放进 path，递归 i+1，再弹出。","n 不超过 10，也可以用二进制 0 到 2^n-1 的每一位决定选不选。两种做法答案集合相同。"],"traces":[{"input":"nums = [1,2,3]","output":"8 个子集","steps":["进入递归时先收集当前路径。第一下收集的是空集。","选 1 后收集 `[1]`。从 1 的后面继续，可以再选 2 得到 `[1,2]`，再选 3 得到 `[1,2,3]`。","每个数的下一层都从自己右边开始，所以不会再生成 `[2,1]` 这种相同组合。","三个互不相同的数，子集数是 `2^3=8`，包括空集。"],"figure":{"kind":"chips","caption":"从空集开始，每个数可选可不选","groups":[["∅"],["1"],["1","2"],["1","2","3"]]}},{"input":"nums = [0]","output":"[[],[0]]","steps":["先收集空集。然后唯一的选择是把 0 放进路径，再收集 `[0]`。没有更多元素。","先记录空路径，再把唯一的 0 放进路径并记录。2 的 0 次方加 2 的 1 次方，正好两个子集。"]}],"complexity":{"time":"O(n·2^n)","space":"O(n)"},"go":"func subsets(nums []int) [][]int {\n  ans := make([][]int, 0)\n  path := make([]int, 0)\n  var dfs func(int)\n  dfs = func(start int) {\n    ans = append(ans, append([]int(nil), path...))\n    for i := start; i \u003c len(nums); i++ {\n      path = append(path, nums[i])\n      dfs(i + 1)\n      path = path[:len(path)-1]\n    }\n  }\n  dfs(0)\n  return ans\n}","ts":"function subsets(nums: number[]): number[][] {\n  const ans: number[][] = [];\n  const path: number[] = [];\n  const dfs = (start: number): void => {\n    ans.push(path.slice());\n    for (let i = start; i \u003c nums.length; i += 1) {\n      path.push(nums[i]);\n      dfs(i + 1);\n      path.pop();\n    }\n  };\n  dfs(0);\n  return ans;\n}"},{"id":17,"title":"电话号码的字母组合","en":"Letter Combinations of a Phone Number","slug":"letter-combinations-of-a-phone-number","difficulty":"medium","category":"回溯","tags":["回溯","字符串"],"summary":"每一位数字对应一组字母，按位向下递归，空输入返回空数组。","description":["给定一个仅包含数字 2 到 9 的字符串，返回它能表示的所有字母组合。数字到字母的映射与电话按键相同。","答案顺序不限。digits 为空时返回空列表。"],"examples":[{"input":"digits = \"23\"","output":"[\"ad\",\"ae\",\"af\",\"bd\",\"be\",\"bf\",\"cd\",\"ce\",\"cf\"]"},{"input":"digits = \"\"","output":"[]"},{"input":"digits = \"2\"","output":"[\"a\",\"b\",\"c\"]"}],"constraints":["0 \u003c= digits.length \u003c= 4","digits[i] 是 [\"2\", \"9\"] 范围内的数字"],"essence":[{"title":"按位展开","body":"第 i 位只能从该数字对应的字母里选一个，然后进入第 i+1 位。"},{"title":"空串","body":"没有数字就没有任何组合，返回空数组，而不是包含一个空字符串。"},{"title":"复杂度","body":"每个数字最多 4 个字母，长度最多 4，组合数很小。"}],"solution":["准备数字到字母的映射。2 到 9 分别对应 abc、def、ghi、jkl、mno、pqrs、tuv、wxyz。","递归参数是当前处理到第几位。处理完所有位时，把缓冲区里的字符串放入答案。","缓冲区长度固定为 digits 的长度，直接按下标写入，避免字符串反复拼接。"],"traces":[{"input":"digits = \"23\"","output":"[\"ad\",\"ae\",\"af\",\"bd\",\"be\",\"bf\",\"cd\",\"ce\",\"cf\"]","steps":["2 对应 `abc`，3 对应 `def`。第一位先固定 a。","第二位依次接 d、e、f，得到 `ad, ae, af`。","第一位改成 b，再接第二位的三个字母，得到 `bd, be, bf`。c 开头同样有三个。","一共 9 个，正好是 3 乘 3。"],"figure":{"kind":"chips","caption":"2 的每个字母，再接上 3 的每个字母","groups":[["ad","ae","af"],["bd","be","bf"],["cd","ce","cf"]]}},{"input":"digits = \"\"","output":"[]","steps":["没有数字就没有任何一位可以展开。返回空数组，而不是包含一个空字符串。","第一位都不存在，递归不会展开任何字母。返回值是空列表，不是 `[\"\"]`。"]}],"complexity":{"time":"O(4^n)","space":"O(n)"},"go":"func letterCombinations(digits string) []string {\n  if digits == \"\" {\n    return []string{}\n  }\n  mapping := []string{\"\", \"\", \"abc\", \"def\", \"ghi\", \"jkl\", \"mno\", \"pqrs\", \"tuv\", \"wxyz\"}\n  ans := make([]string, 0)\n  buf := make([]byte, len(digits))\n  var dfs func(int)\n  dfs = func(i int) {\n    if i == len(digits) {\n      ans = append(ans, string(buf))\n      return\n    }\n    letters := mapping[digits[i]-'0']\n    for j := 0; j \u003c len(letters); j++ {\n      buf[i] = letters[j]\n      dfs(i + 1)\n    }\n  }\n  dfs(0)\n  return ans\n}","ts":"function letterCombinations(digits: string): string[] {\n  if (digits === '') {\n    return [];\n  }\n  const mapping = ['', '', 'abc', 'def', 'ghi', 'jkl', 'mno', 'pqrs', 'tuv', 'wxyz'];\n  const ans: string[] = [];\n  const buf = new Array\u003cstring>(digits.length);\n  const dfs = (i: number): void => {\n    if (i === digits.length) {\n      ans.push(buf.join(''));\n      return;\n    }\n    const letters = mapping[Number(digits[i])];\n    for (const ch of letters) {\n      buf[i] = ch;\n      dfs(i + 1);\n    }\n  };\n  dfs(0);\n  return ans;\n}"},{"id":39,"title":"组合总和","en":"Combination Sum","slug":"combination-sum","difficulty":"medium","category":"回溯","tags":["回溯"],"summary":"同一个数可以重复选，但下一层从当前下标开始，避免同一组合的不同顺序。","description":["给定一个无重复元素的正整数数组 candidates 和一个目标整数 target，找出所有可以使数字和为目标数的组合。","同一个数字可以被无限制重复选取。两个组合如果所选数字的多重集合相同，视为同一个组合。"],"examples":[{"input":"candidates = [2,3,6,7], target = 7","output":"[[2,2,3],[7]]"},{"input":"candidates = [2,3,5], target = 8","output":"[[2,2,2,2],[2,3,3],[3,5]]"}],"constraints":["1 \u003c= candidates.length \u003c= 30","2 \u003c= candidates[i] \u003c= 40","candidates 中的元素互不相同","1 \u003c= target \u003c= 40"],"essence":[{"title":"可重复但有序","body":"递归时传入 i 而不是 i+1，表示当前数还能再选。因为不会回到 i 前面，组合不会重复。"},{"title":"排序后剪枝","body":"候选数升序后，当前数已经大于剩余值，后面的数更大，可以直接停止这一层。"},{"title":"复杂度","body":"target 很小，搜索树被剩余值限制。最坏仍是指数级。"}],"solution":["先把候选数组排序。回溯参数是起始下标和剩余目标。剩余为 0 时收集当前组合。","从起始下标向后枚举。如果候选数大于剩余值，后面都不可能，跳出循环。否则把该数放进路径，剩余值减去它，下一层仍然从同一个下标开始。","返回前弹出路径中的数，让同层的下一个候选使用干净的路径。"],"traces":[{"input":"candidates = [2,3,6,7], target = 7","output":"[[2,2,3],[7]]","steps":["排序后从 2 开始。2 可以重复选，路径 `[2,2,2]` 还剩 1，再选 2 就超过了。","回溯成 `[2,2]`，改选 3，正好剩下 0。记下 `[2,2,3]`。","继续换更大的起点。单独一个 7 正好等于目标，记下 `[7]`。","6 开头的剩余值小于 6，后面的数更大，直接停。同一个组合不会因为 `[2,3,2]` 这种不同顺序再出现。"],"figure":{"kind":"chips","caption":"2 可以重复使用，直到剩下的目标被 3 凑满","groups":[["2","2","3"],["7"]]}},{"input":"candidates = [2,3,5], target = 8","output":"[[2,2,2,2],[2,3,3],[3,5]]","steps":["四个 2 凑成 8。`[2,2]` 之后改用 3，再需要一个 3，得到 `[2,3,3]`。","从 3 开始则是 3 加 5。5 自己不够 8，再加 5 又超过。所以只有这三组。"]}],"complexity":{"time":"指数级","space":"O(target)"},"go":"func combinationSum(candidates []int, target int) [][]int {\n  sort.Ints(candidates)\n  ans := make([][]int, 0)\n  path := make([]int, 0)\n  var dfs func(int, int)\n  dfs = func(start, remain int) {\n    if remain == 0 {\n      ans = append(ans, append([]int(nil), path...))\n      return\n    }\n    for i := start; i \u003c len(candidates); i++ {\n      if candidates[i] > remain {\n        break\n      }\n      path = append(path, candidates[i])\n      dfs(i, remain-candidates[i])\n      path = path[:len(path)-1]\n    }\n  }\n  dfs(0, target)\n  return ans\n}","ts":"function combinationSum(candidates: number[], target: number): number[][] {\n  candidates.sort((a, b) => a - b);\n  const ans: number[][] = [];\n  const path: number[] = [];\n  const dfs = (start: number, remain: number): void => {\n    if (remain === 0) {\n      ans.push(path.slice());\n      return;\n    }\n    for (let i = start; i \u003c candidates.length; i += 1) {\n      if (candidates[i] > remain) {\n        break;\n      }\n      path.push(candidates[i]);\n      dfs(i, remain - candidates[i]);\n      path.pop();\n    }\n  };\n  dfs(0, target);\n  return ans;\n}"},{"id":22,"title":"括号生成","en":"Generate Parentheses","slug":"generate-parentheses","difficulty":"medium","category":"回溯","tags":["回溯","字符串"],"summary":"只要剩余的左括号还够用就可以放左括号；右括号的数量不能超过已经放好的左括号。","description":["数字 n 代表要生成的括号对数。请生成所有可能并且有效的括号组合。","有效指任意前缀里左括号不少于右括号，并且最终左右括号数量相等。"],"examples":[{"input":"n = 3","output":"[\"((()))\",\"(()())\",\"(())()\",\"()(())\",\"()()()\"]"},{"input":"n = 1","output":"[\"()\"]"}],"constraints":["1 \u003c= n \u003c= 8"],"essence":[{"title":"两个计数","body":"open 小于 n 才能再放左括号。close 小于 open 才能放右括号。"},{"title":"卡特兰数","body":"合法组合的个数是第 n 个卡特兰数。n=3 时是 5。"},{"title":"复杂度","body":"只生成合法串，时间与卡特兰数和串长成正比。"}],"solution":["用长度为 2n 的缓冲区逐位填写。递归参数记录已经填写的位置、已经使用的左括号数和右括号数。","位置填满时得到一个合法字符串。因为每一步都保持右括号不超过左括号，并且左括号不超过 n，最终结果一定有效。","不需要先生成所有括号排列再过滤，那样会多做大量无效分支。"],"traces":[{"input":"n = 3","output":"[\"((()))\",\"(()())\",\"(())()\",\"()(())\",\"()()()\"]","steps":["左括号还可以放 3 个，右括号一开始一个都不能放，因为右边不能比左边多。","先放三个左括号，再放三个右括号，得到 `((()))`。","回溯时少放一个左括号、提前放右括号，就会产生 `(()())`、`(())()` 这些仍然合法的串。","n=3 的合法括号数是第 3 个卡特兰数 5。每一个前缀都满足左括号不少于右括号。"],"figure":{"kind":"window","caption":"左右括号数量始终合法","text":"((()))","ranges":[[0,5]]}},{"input":"n = 1","output":"[\"()\"]","steps":["只能先放左括号。放完后右括号数量还小于左括号，再放一个右括号。缓冲区满了，只有 `()`。","右括号只有在数量少于左括号时才能放。所以第一个字符只能是左括号，第二个才轮到右括号。"]}],"complexity":{"time":"O(C_n · n)","space":"O(n)"},"go":"func generateParenthesis(n int) []string {\n  ans := make([]string, 0)\n  buf := make([]byte, 2*n)\n  var dfs func(int, int, int)\n  dfs = func(i, open, close int) {\n    if i == 2*n {\n      ans = append(ans, string(buf))\n      return\n    }\n    if open \u003c n {\n      buf[i] = '('\n      dfs(i+1, open+1, close)\n    }\n    if close \u003c open {\n      buf[i] = ')'\n      dfs(i+1, open, close+1)\n    }\n  }\n  dfs(0, 0, 0)\n  return ans\n}","ts":"function generateParenthesis(n: number): string[] {\n  const ans: string[] = [];\n  const buf = new Array\u003cstring>(2 * n);\n  const dfs = (i: number, open: number, close: number): void => {\n    if (i === 2 * n) {\n      ans.push(buf.join(''));\n      return;\n    }\n    if (open \u003c n) {\n      buf[i] = '(';\n      dfs(i + 1, open + 1, close);\n    }\n    if (close \u003c open) {\n      buf[i] = ')';\n      dfs(i + 1, open, close + 1);\n    }\n  };\n  dfs(0, 0, 0);\n  return ans;\n}"},{"id":79,"title":"单词搜索","en":"Word Search","slug":"word-search","difficulty":"medium","category":"回溯","tags":["回溯","矩阵"],"summary":"从每个格子出发匹配单词。走过的格子临时改掉，递归返回后恢复。","description":["给定一个字符矩阵 board 和一个字符串 word。判断 word 是否可以由矩阵中相邻的格子拼出。","相邻指上下左右，同一个格子在一次匹配中不能重复使用。"],"examples":[{"input":"board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"E\",\"E\"]], word = \"ABCCED\"","output":"true"},{"input":"board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"E\",\"E\"]], word = \"SEE\"","output":"true"},{"input":"board = [[\"A\",\"B\",\"C\",\"E\"],[\"S\",\"F\",\"C\",\"S\"],[\"A\",\"D\",\"E\",\"E\"]], word = \"ABCB\"","output":"false"}],"constraints":["m == board.length","n == board[i].length","1 \u003c= m, n \u003c= 6","1 \u003c= word.length \u003c= 15","board 和 word 只由大小写英文字母组成"],"essence":[{"title":"匹配到第 k 个字符","body":"递归参数带着当前要匹配的下标。下标等于单词长度就成功。"},{"title":"原地标记","body":"把当前格子改成一个不可能出现的字符，四个方向返回后再改回来。"},{"title":"复杂度","body":"从每个格子出发，最坏分支因子是 4，单词长度最多 15，网格也很小。"}],"solution":["对每个格子尝试作为起点。递归时如果越界、字符不匹配，就失败。","字符匹配后，先把该格子标记成已使用，再向四个方向匹配下一个字符。只要一个方向成功就返回真。","无论成功还是失败，都要把格子恢复。成功时恢复发生在递归返回的路上，不会影响已经得到的结果。"],"traces":[{"input":"board 三行, word = \"ABCCED\"","output":"true","steps":["从左上角 A 开始，匹配单词第 0 个字符。把这个 A 临时改成不能再用的标记。","右边的 B、再右边的 C、下面的 C 依次匹配。来到中间行第二个 C 后，可以向左找到 E，再向下找到 D。","六个字符都匹配完，返回 true。返回途中把改过的格子恢复。"],"figure":{"kind":"grid","caption":"ABCCED 沿相邻格子走，走过的格子不能再用","rows":[["A","B","C","E"],["S","F","C","S"],["A","D","E","E"]],"on":[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1]]}},{"input":"同一个 board, word = \"ABCB\"","output":"false","steps":["前三个字符仍能走出 `A-B-C`。下一个要回到 B，但 B 在这条路径里已经用过，被临时标记挡住。","其他起点也走不出不重复使用格子的 `ABCB`。返回 false。"]}],"complexity":{"time":"O(mn·4^L)","space":"O(L)"},"go":"func exist(board [][]byte, word string) bool {\n  m, n := len(board), len(board[0])\n  var dfs func(int, int, int) bool\n  dfs = func(i, j, k int) bool {\n    if k == len(word) {\n      return true\n    }\n    if i \u003c 0 || j \u003c 0 || i >= m || j >= n || board[i][j] != word[k] {\n      return false\n    }\n    saved := board[i][j]\n    board[i][j] = '#'\n    found := dfs(i+1, j, k+1) || dfs(i-1, j, k+1) || dfs(i, j+1, k+1) || dfs(i, j-1, k+1)\n    board[i][j] = saved\n    return found\n  }\n  for i := 0; i \u003c m; i++ {\n    for j := 0; j \u003c n; j++ {\n      if dfs(i, j, 0) {\n        return true\n      }\n    }\n  }\n  return false\n}","ts":"function exist(board: string[][], word: string): boolean {\n  const m = board.length;\n  const n = board[0].length;\n  const dfs = (i: number, j: number, k: number): boolean => {\n    if (k === word.length) {\n      return true;\n    }\n    if (i \u003c 0 || j \u003c 0 || i >= m || j >= n || board[i][j] !== word[k]) {\n      return false;\n    }\n    const saved = board[i][j];\n    board[i][j] = '#';\n    const found = dfs(i + 1, j, k + 1) || dfs(i - 1, j, k + 1) || dfs(i, j + 1, k + 1) || dfs(i, j - 1, k + 1);\n    board[i][j] = saved;\n    return found;\n  };\n  for (let i = 0; i \u003c m; i += 1) {\n    for (let j = 0; j \u003c n; j += 1) {\n      if (dfs(i, j, 0)) {\n        return true;\n      }\n    }\n  }\n  return false;\n}"},{"id":131,"title":"分割回文串","en":"Palindrome Partitioning","slug":"palindrome-partitioning","difficulty":"medium","category":"回溯","tags":["回溯","字符串"],"summary":"从当前位置向后枚举结尾，只有切出来的片段是回文才继续切后面。","description":["给定字符串 s，把它分割成若干子串，使每个子串都是回文。返回所有可能的分割方案。","答案顺序不限。单个字符本身是回文。"],"examples":[{"input":"s = \"aab\"","output":"[[\"a\",\"a\",\"b\"],[\"aa\",\"b\"]]"},{"input":"s = \"a\"","output":"[[\"a\"]]"}],"constraints":["1 \u003c= s.length \u003c= 16","s 仅由小写英文字母组成"],"essence":[{"title":"切点就是回溯层","body":"当前起点是 start。枚举 end，s[start..end] 是回文时才把它放进路径。"},{"title":"回文判断","body":"长度最多 16，每次双指针判断就够。也可以预先用区间 DP 算出所有回文子串。"},{"title":"复杂度","body":"分割方案数最坏是指数级，n 很小。"}],"solution":["回溯函数的参数是下一段的起点。起点走到字符串末尾时，当前路径是一种完整分割。","否则尝试所有更靠右的终点。片段是回文才递归。递归返回后弹出这段，尝试更长的片段。","\"aab\" 会先得到 a|a|b，再在第一段扩展成 aa|b。b 单独成段时也是回文。"],"traces":[{"input":"s = \"aab\"","output":"[[\"a\",\"a\",\"b\"],[\"aa\",\"b\"]]","steps":["从下标 0 开始。先切出一个字符 `a`，它是回文。剩下 `ab` 再切成 `a` 和 `b`，得到 `[a,a,b]`。","回到第一刀，改切两个字符 `aa`。左右字符相同，是回文。剩下的 `b` 自己也是回文，得到 `[aa,b]`。","`aab` 整体不是回文，不能作为唯一一段。所以只有两种切法。"],"figure":{"kind":"window","caption":"a|a|b 和 aa|b 都是回文切法","text":"aab","ranges":[[0,1]]}},{"input":"s = \"a\"","output":"[[\"a\"]]","steps":["只有一种切法：整段就是一个字符。单字符一定是回文，结果 `[[a]]`。","起点 0、终点 0 这段是回文，切完后起点已经到字符串末尾，收集这一种方案。"]}],"complexity":{"time":"指数级","space":"O(n)"},"go":"func partition(s string) [][]string {\n  ans := make([][]string, 0)\n  path := make([]string, 0)\n  var dfs func(int)\n  dfs = func(start int) {\n    if start == len(s) {\n      ans = append(ans, append([]string(nil), path...))\n      return\n    }\n    for end := start; end \u003c len(s); end++ {\n      if !isPalindrome(s, start, end) {\n        continue\n      }\n      path = append(path, s[start:end+1])\n      dfs(end + 1)\n      path = path[:len(path)-1]\n    }\n  }\n  dfs(0)\n  return ans\n}\n\nfunc isPalindrome(s string, left, right int) bool {\n  for left \u003c right {\n    if s[left] != s[right] {\n      return false\n    }\n    left++\n    right--\n  }\n  return true\n}","ts":"function partition(s: string): string[][] {\n  const ans: string[][] = [];\n  const path: string[] = [];\n  const isPal = (left: number, right: number): boolean => {\n    while (left \u003c right) {\n      if (s[left] !== s[right]) {\n        return false;\n      }\n      left += 1;\n      right -= 1;\n    }\n    return true;\n  };\n  const dfs = (start: number): void => {\n    if (start === s.length) {\n      ans.push(path.slice());\n      return;\n    }\n    for (let end = start; end \u003c s.length; end += 1) {\n      if (!isPal(start, end)) {\n        continue;\n      }\n      path.push(s.slice(start, end + 1));\n      dfs(end + 1);\n      path.pop();\n    }\n  };\n  dfs(0);\n  return ans;\n}"},{"id":51,"title":"N 皇后","en":"N-Queens","slug":"n-queens","difficulty":"hard","category":"回溯","tags":["回溯"],"summary":"逐行放皇后，用三个布尔数组记录列和两条对角线是否被占。","description":["n 皇后问题研究的是如何将 n 个皇后放在 n×n 的棋盘上，使皇后彼此不能攻击。","皇后可以攻击同一行、同一列和两条对角线上的棋子。返回所有不同的解决方案，每个方案用字符串数组表示棋盘，\"Q\" 表示皇后，\".\" 表示空位。"],"examples":[{"input":"n = 4","output":"[[\".Q..\",\"...Q\",\"Q...\",\"..Q.\"],[\"..Q.\",\"Q...\",\"...Q\",\".Q..\"]]"},{"input":"n = 1","output":"[[\"Q\"]]"}],"constraints":["1 \u003c= n \u003c= 9"],"essence":[{"title":"一行一个","body":"每行恰好放一个皇后后，行冲突自然消失，只需要管列和对角线。"},{"title":"对角线编号","body":"主对角线可用 row-col+n 编号，副对角线可用 row+col 编号。"},{"title":"复杂度","body":"n 不超过 9。剪枝后实际搜索量远小于 n^n。"}],"solution":["从第 0 行开始，尝试把皇后放在每一列。如果该列、row-col 对角线或 row+col 对角线已被占用，就跳过。","放好后标记三个数组，递归下一行，返回时撤销标记。","行号等于 n 时，棋盘是一个解。把每一行的字节数组复制成字符串再保存，避免后面修改影响已经收集的答案。"],"traces":[{"input":"n = 4","output":"两张互不攻击的棋盘","steps":["第 0 行如果放在第 0 列，后面每一行都会在列或对角线上被挡住，这条分支失败。","第 0 行放在第 1 列。第 1 行不能放 0、1、2，只能放第 3 列。继续放完第 2、3 行，得到 `.Q.. / ...Q / Q... / ..Q.`。","第 0 行放在第 2 列，会对称地得到另一解 `..Q. / Q... / ...Q / .Q..`。","第 0 行放在第 3 列同样失败。n=4 只有这两解。"],"figure":{"kind":"grid","caption":"第 0 行的皇后放在第 1 列，后面各行躲开列和对角线","rows":[[".","Q",".","."],[".",".",".","Q"],["Q",".",".","."],[".",".","Q","."]],"on":[[0,1],[1,3],[2,0],[3,2]]}},{"input":"n = 1","output":"[[\"Q\"]]","steps":["只有一行一列。把唯一的位置放上 Q，没有其他皇后可以攻击它。","第 0 行只有一列可选。放上 Q 后行号等于 n，直接记录棋盘，没有对角线冲突需要检查。"]}],"complexity":{"time":"指数级","space":"O(n)"},"go":"func solveNQueens(n int) [][]string {\n  cols := make([]bool, n)\n  diag1 := make([]bool, 2*n)\n  diag2 := make([]bool, 2*n)\n  board := make([][]byte, n)\n  for i := range board {\n    board[i] = make([]byte, n)\n    for j := range board[i] {\n      board[i][j] = '.'\n    }\n  }\n  ans := make([][]string, 0)\n  var dfs func(int)\n  dfs = func(row int) {\n    if row == n {\n      snap := make([]string, n)\n      for i := range board {\n        snap[i] = string(board[i])\n      }\n      ans = append(ans, snap)\n      return\n    }\n    for col := 0; col \u003c n; col++ {\n      d1, d2 := row-col+n, row+col\n      if cols[col] || diag1[d1] || diag2[d2] {\n        continue\n      }\n      cols[col], diag1[d1], diag2[d2] = true, true, true\n      board[row][col] = 'Q'\n      dfs(row + 1)\n      board[row][col] = '.'\n      cols[col], diag1[d1], diag2[d2] = false, false, false\n    }\n  }\n  dfs(0)\n  return ans\n}","ts":"function solveNQueens(n: number): string[][] {\n  const cols = new Array\u003cboolean>(n).fill(false);\n  const diag1 = new Array\u003cboolean>(2 * n).fill(false);\n  const diag2 = new Array\u003cboolean>(2 * n).fill(false);\n  const board = Array.from({ length: n }, () => new Array\u003cstring>(n).fill('.'));\n  const ans: string[][] = [];\n  const dfs = (row: number): void => {\n    if (row === n) {\n      ans.push(board.map((line) => line.join('')));\n      return;\n    }\n    for (let col = 0; col \u003c n; col += 1) {\n      const d1 = row - col + n;\n      const d2 = row + col;\n      if (cols[col] || diag1[d1] || diag2[d2]) {\n        continue;\n      }\n      cols[col] = true;\n      diag1[d1] = true;\n      diag2[d2] = true;\n      board[row][col] = 'Q';\n      dfs(row + 1);\n      board[row][col] = '.';\n      cols[col] = false;\n      diag1[d1] = false;\n      diag2[d2] = false;\n    }\n  };\n  dfs(0);\n  return ans;\n}"},{"id":35,"title":"搜索插入位置","en":"Search Insert Position","slug":"search-insert-position","difficulty":"easy","category":"二分查找","tags":["数组","二分查找"],"summary":"找第一个大于等于 target 的位置。找不到时这个位置就是插入点。","description":["给定一个升序且无重复元素的数组 nums 和目标值 target。如果 target 存在，返回它的下标；否则返回它按顺序插入后的下标。","要求时间复杂度 O(log n)。"],"examples":[{"input":"nums = [1,3,5,6], target = 5","output":"2"},{"input":"nums = [1,3,5,6], target = 2","output":"1"},{"input":"nums = [1,3,5,6], target = 7","output":"4"}],"constraints":["1 \u003c= nums.length \u003c= 10^4","-10^4 \u003c= nums[i], target \u003c= 10^4","nums 严格递增"],"essence":[{"title":"下界","body":"维护的是第一个使 nums[mid] >= target 的位置。右边界用开区间，循环结束时 left 就是答案。"},{"title":"插到末尾","body":"所有元素都小于 target 时，left 会停在 n，正好是插入到末尾的位置。"},{"title":"复杂度","body":"时间 O(log n)，空间 O(1)。"}],"solution":["设查找范围为 [0, n)。取中点，如果 nums[mid] 小于 target，答案在右边，left = mid+1；否则答案可能是 mid 或更左边，right = mid。","循环结束时 left == right，它左边的元素都小于 target，它自己如果存在则大于等于 target。","这就是后续“找第一个和最后一个位置”里的 lower bound。"],"traces":[{"input":"nums = [1,3,5,6], target = 5","output":"2","steps":["查找范围是 `[0,4)`。中点下标 2 的值是 5，已经大于等于目标，右边界收到 2。","范围变成 `[0,2)`。中点 0 的值是 1，小于 5，左边界收到 1。","中点 1 的值是 3，仍小于 5，左边界收到 2。左右相遇，返回 2。这里 5 正好存在。"],"figure":{"kind":"array","caption":"第一个大于等于 5 的位置就是下标 2","values":[1,3,5,6],"on":[2],"labels":{"2":"命中"}}},{"input":"nums = [1,3,5,6], target = 2","output":"1","steps":["同样找第一个大于等于 2 的位置。1 小于 2，3 已经不小于 2。","2 不在数组里，但返回的 1 就是它应该插入的位置，插进去后数组仍保持有序。目标 7 则会停在长度 4，表示插到末尾。"],"figure":{"kind":"array","caption":"2 不在数组里，插在 1 和 3 之间","values":[1,3,5,6],"on":[1],"alt":[0],"labels":{"0":"小于 2","1":"插入点"}}}],"complexity":{"time":"O(log n)","space":"O(1)"},"go":"func searchInsert(nums []int, target int) int {\n  left, right := 0, len(nums)\n  for left \u003c right {\n    mid := (left + right) / 2\n    if nums[mid] \u003c target {\n      left = mid + 1\n    } else {\n      right = mid\n    }\n  }\n  return left\n}","ts":"function searchInsert(nums: number[], target: number): number {\n  let left = 0;\n  let right = nums.length;\n  while (left \u003c right) {\n    const mid = (left + right) >> 1;\n    if (nums[mid] \u003c target) {\n      left = mid + 1;\n    } else {\n      right = mid;\n    }\n  }\n  return left;\n}"},{"id":74,"title":"搜索二维矩阵","en":"Search a 2D Matrix","slug":"search-a-2d-matrix","difficulty":"medium","category":"二分查找","tags":["矩阵","二分查找"],"summary":"每行首元素大于上一行末元素，整个矩阵可以看成一个有序一维数组。","description":["给定 m x n 矩阵。每行从左到右递增，每行的第一个数大于上一行的最后一个数。判断 target 是否在矩阵中。","要求时间复杂度 O(log(mn))。"],"examples":[{"input":"matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3","output":"true"},{"input":"matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 13","output":"false"}],"constraints":["m == matrix.length","n == matrix[0].length","1 \u003c= m, n \u003c= 100","-10^4 \u003c= matrix[i][j], target \u003c= 10^4"],"essence":[{"title":"二维下标映射","body":"把一维下标 mid 映射成 row = mid / n，col = mid % n。"},{"title":"和矩阵 II 的差别","body":"本题行与行之间也整体有序，所以一次二分就够。矩阵 II 只能保证行、列各自有序。"},{"title":"复杂度","body":"时间 O(log(mn))，空间 O(1)。"}],"solution":["把矩阵按行展开后是严格递增的。在区间 [0, m*n-1] 上做二分。","中点对应的值等于目标就返回真。小于目标则去右半，大于目标则去左半。","循环结束还没找到就返回假。单个元素的矩阵也适用。"],"traces":[{"input":"matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3","output":"true","steps":["按行展开后是一个 12 个数的有序数组。二分中点落在第二行的 11。","11 比 3 大，去左半。下一次中点是第一行的 3，命中。","二维坐标只是 `mid / 列数` 和 `mid % 列数`，不需要真的把矩阵摊平。"],"figure":{"kind":"grid","caption":"把矩阵看成一个有序数组后，二分会落到 3","rows":[[1,3,5,7],[10,11,16,20],[23,30,34,60]],"on":[[0,1]]}},{"input":"同一个矩阵, target = 13","output":"false","steps":["13 比 11 大、比 16 小。二分会把左右边界收拢到这两个数之间，最后区间为空，返回 false。","二分的左右边界最后交叉，没有任何 mid 的值等于 13。"]}],"complexity":{"time":"O(log(mn))","space":"O(1)"},"go":"func searchMatrix(matrix [][]int, target int) bool {\n  m, n := len(matrix), len(matrix[0])\n  left, right := 0, m*n-1\n  for left \u003c= right {\n    mid := (left + right) / 2\n    value := matrix[mid/n][mid%n]\n    if value == target {\n      return true\n    }\n    if value \u003c target {\n      left = mid + 1\n    } else {\n      right = mid - 1\n    }\n  }\n  return false\n}","ts":"function searchMatrix(matrix: number[][], target: number): boolean {\n  const m = matrix.length;\n  const n = matrix[0].length;\n  let left = 0;\n  let right = m * n - 1;\n  while (left \u003c= right) {\n    const mid = (left + right) >> 1;\n    const value = matrix[Math.floor(mid / n)][mid % n];\n    if (value === target) {\n      return true;\n    }\n    if (value \u003c target) {\n      left = mid + 1;\n    } else {\n      right = mid - 1;\n    }\n  }\n  return false;\n}"},{"id":34,"title":"在排序数组中查找元素的第一个和最后一个位置","en":"Find First and Last Position of Element in Sorted Array","slug":"find-first-and-last-position-of-element-in-sorted-array","difficulty":"medium","category":"二分查找","tags":["数组","二分查找"],"summary":"做两次二分：一次找第一个大于等于 target 的位置，一次找第一个大于 target 的位置。","description":["给定非降序数组 nums 和目标值 target。找出 target 在数组中的起始下标和结束下标。","如果 target 不存在，返回 [-1, -1]。要求时间复杂度 O(log n)。"],"examples":[{"input":"nums = [5,7,7,8,8,10], target = 8","output":"[3,4]"},{"input":"nums = [5,7,7,8,8,10], target = 6","output":"[-1,-1]"},{"input":"nums = [], target = 0","output":"[-1,-1]"}],"constraints":["0 \u003c= nums.length \u003c= 10^5","-10^9 \u003c= nums[i], target \u003c= 10^9","nums 非降序"],"essence":[{"title":"lower 与 upper","body":"lower 是第一个 >= target 的下标。upper 是第一个 > target 的下标。存在时区间是 [lower, upper-1]。"},{"title":"判断存在","body":"lower 越界，或者 nums[lower] 不是 target，都说明不存在。"},{"title":"复杂度","body":"两次二分，时间 O(log n)。"}],"solution":["lowerBound 使用“小于 target 就去右边，否则去左边”的写法，右端是开区间。upperBound 把条件改成“小于等于 target 就去右边”。","两次查找都是 O(log n)，比找到一个 target 再向两边线性扩展更稳。线性扩展在全部元素相同时会退化成 O(n)。","空数组的 lower 是 0，等于长度，直接返回 [-1,-1]。"],"traces":[{"input":"nums = [5,7,7,8,8,10], target = 8","output":"[3,4]","steps":["第一次二分找第一个大于等于 8 的位置，停在下标 3，值正好是 8。","第二次找第一个大于 8 的位置，也就是大于等于 9 的位置，停在下标 5。","最后一个 8 的下标是 `5-1=4`。答案 `[3,4]`。"],"figure":{"kind":"array","caption":"第一个 8 在下标 3，最后一个 8 在下标 4","values":[5,7,7,8,8,10],"on":[3,4],"labels":{"3":"左","4":"右"}}},{"input":"nums = [5,7,7,8,8,10], target = 6","output":"[-1,-1]","steps":["第一个大于等于 6 的位置是下标 2，那里的值是 7，不是 6。说明 6 不存在，直接返回 `[-1,-1]`，不用再找右端点。","左端点的值必须再核对一次。位置合法但值不是目标，说明目标落在两个元素的空隙里。"]}],"complexity":{"time":"O(log n)","space":"O(1)"},"go":"func searchRange(nums []int, target int) []int {\n  lower := func(value int) int {\n    left, right := 0, len(nums)\n    for left \u003c right {\n      mid := (left + right) / 2\n      if nums[mid] \u003c value {\n        left = mid + 1\n      } else {\n        right = mid\n      }\n    }\n    return left\n  }\n  left := lower(target)\n  if left == len(nums) || nums[left] != target {\n    return []int{-1, -1}\n  }\n  return []int{left, lower(target+1) - 1}\n}","ts":"function searchRange(nums: number[], target: number): number[] {\n  const lower = (value: number): number => {\n    let left = 0;\n    let right = nums.length;\n    while (left \u003c right) {\n      const mid = (left + right) >> 1;\n      if (nums[mid] \u003c value) {\n        left = mid + 1;\n      } else {\n        right = mid;\n      }\n    }\n    return left;\n  };\n  const left = lower(target);\n  if (left === nums.length || nums[left] !== target) {\n    return [-1, -1];\n  }\n  return [left, lower(target + 1) - 1];\n}"},{"id":33,"title":"搜索旋转排序数组","en":"Search in Rotated Sorted Array","slug":"search-in-rotated-sorted-array","difficulty":"medium","category":"二分查找","tags":["数组","二分查找"],"summary":"每一步都有一半仍然有序。先判断目标在不在有序的那一半。","description":["整数数组 nums 原本严格升序，之后可能在某个下标处被旋转。例如 [0,1,2,4,5,6,7] 可能变成 [4,5,6,7,0,1,2]。","给定 target，如果存在就返回下标，否则返回 -1。数组中的值互不相同，要求时间 O(log n)。"],"examples":[{"input":"nums = [4,5,6,7,0,1,2], target = 0","output":"4"},{"input":"nums = [4,5,6,7,0,1,2], target = 3","output":"-1"},{"input":"nums = [1], target = 0","output":"-1"}],"constraints":["1 \u003c= nums.length \u003c= 5000","-10^4 \u003c= nums[i], target \u003c= 10^4","nums 中的值互不相同"],"essence":[{"title":"判断哪半有序","body":"nums[left] \u003c= nums[mid] 时，左半含 mid 是有序的；否则右半有序。"},{"title":"目标是否落在有序半边","body":"落在有序半边里就收缩到那一半，否则去另一半。"},{"title":"复杂度","body":"每次排除一半，时间 O(log n)。有重复元素时这个判断会失效，那是另一道题。"}],"solution":["普通二分依赖整个区间有序。旋转后只有其中一半保持有序，但每次仍然可以判断是哪一半。","如果左半有序，并且 target 落在 nums[left] 和 nums[mid] 之间，就去左边；否则 target 只能在右边。右半有序时对称处理。","比较时使用闭区间。nums[mid] 等于 target 立即返回。循环结束返回 -1。"],"traces":[{"input":"nums = [4,5,6,7,0,1,2], target = 0","output":"4","steps":["中点是 7。左半 `[4,5,6,7]` 有序，但 0 不在 4 到 7 之间，所以去右半。","右半 `[0,1,2]` 的中点是 1。这一段有序，0 小于 1，继续去左边。","剩下下标 4，值正好是 0。返回 4。"],"figure":{"kind":"array","caption":"左半有序但不包含 0，答案在右半的下标 4","values":[4,5,6,7,0,1,2],"on":[4],"alt":[0,3],"labels":{"0":"左半","4":"目标"}}},{"input":"nums = [4,5,6,7,0,1,2], target = 3","output":"-1","steps":["3 既不在左半的有序段 `[4,7]`，也不在右半的有序段 `[0,2]`。每次都走向另一半，区间最后变空，返回 -1。","每一半有序区间都用不包含 3 的不等式把目标推走。区间收空后返回 -1。"]}],"complexity":{"time":"O(log n)","space":"O(1)"},"go":"func search(nums []int, target int) int {\n  left, right := 0, len(nums)-1\n  for left \u003c= right {\n    mid := (left + right) / 2\n    if nums[mid] == target {\n      return mid\n    }\n    if nums[left] \u003c= nums[mid] {\n      if nums[left] \u003c= target && target \u003c nums[mid] {\n        right = mid - 1\n      } else {\n        left = mid + 1\n      }\n    } else if nums[mid] \u003c target && target \u003c= nums[right] {\n      left = mid + 1\n    } else {\n      right = mid - 1\n    }\n  }\n  return -1\n}","ts":"function search(nums: number[], target: number): number {\n  let left = 0;\n  let right = nums.length - 1;\n  while (left \u003c= right) {\n    const mid = (left + right) >> 1;\n    if (nums[mid] === target) {\n      return mid;\n    }\n    if (nums[left] \u003c= nums[mid]) {\n      if (nums[left] \u003c= target && target \u003c nums[mid]) {\n        right = mid - 1;\n      } else {\n        left = mid + 1;\n      }\n    } else if (nums[mid] \u003c target && target \u003c= nums[right]) {\n      left = mid + 1;\n    } else {\n      right = mid - 1;\n    }\n  }\n  return -1;\n}"},{"id":153,"title":"寻找旋转排序数组中的最小值","en":"Find Minimum in Rotated Sorted Array","slug":"find-minimum-in-rotated-sorted-array","difficulty":"medium","category":"二分查找","tags":["数组","二分查找"],"summary":"最小值是唯一一个比右邻居更小的转折点。和右端比较就能知道转折在哪一侧。","description":["已知一个长度为 n 的数组，原本按升序排列，并在某个未知下标处旋转了一次。数组中没有重复元素。","找出其中的最小元素。要求时间 O(log n)。"],"examples":[{"input":"nums = [3,4,5,1,2]","output":"1"},{"input":"nums = [4,5,6,7,0,1,2]","output":"0"},{"input":"nums = [11,13,15,17]","output":"11"}],"constraints":["n == nums.length","1 \u003c= n \u003c= 5000","-5000 \u003c= nums[i] \u003c= 5000","nums 中的值互不相同"],"essence":[{"title":"和右端比较","body":"nums[mid] > nums[right] 时，最小值一定在 mid 右边。否则最小值在 mid 或 mid 左边，right 可以收到 mid。"},{"title":"不和左端比","body":"没有旋转时左端就是最小值。和右端比较可以同时覆盖旋转和未旋转。"},{"title":"复杂度","body":"时间 O(log n)，空间 O(1)。"}],"solution":["使用左闭右闭区间。只要 left \u003c right，区间里就还有比较空间。","中点大于右端，说明右半边发生了下降，最小值在 mid+1 到 right。否则最小值在 left 到 mid，mid 自己可能就是最小值，所以 right = mid 而不是 mid-1。","循环结束时 left 和 right 重合，指向最小值。"],"traces":[{"input":"nums = [3,4,5,1,2]","output":"1","steps":["中点 5 比右端 2 大，最小值一定在中点右边，左边界移到 1。","现在区间是 `[1,2]`。中点 1 已经不大于右端 2，最小值就在中点或左边，右边界收到 1。","左右相遇，值是 1。它是旋转后唯一比右边邻居更小的转折点。"],"figure":{"kind":"array","caption":"最小值是下降的那一格","values":[3,4,5,1,2],"on":[3],"labels":{"3":"最小"}}},{"input":"nums = [11,13,15,17]","output":"11","steps":["没有旋转。中点始终不大于右端，右边界一直向左收，最后停在下标 0。最小值就是原来的第一个元素 11。","右边界不断等于中点而不是跳过中点，所以最小值即使在最左边也不会被漏掉。"]}],"complexity":{"time":"O(log n)","space":"O(1)"},"go":"func findMin(nums []int) int {\n  left, right := 0, len(nums)-1\n  for left \u003c right {\n    mid := (left + right) / 2\n    if nums[mid] > nums[right] {\n      left = mid + 1\n    } else {\n      right = mid\n    }\n  }\n  return nums[left]\n}","ts":"function findMin(nums: number[]): number {\n  let left = 0;\n  let right = nums.length - 1;\n  while (left \u003c right) {\n    const mid = (left + right) >> 1;\n    if (nums[mid] > nums[right]) {\n      left = mid + 1;\n    } else {\n      right = mid;\n    }\n  }\n  return nums[left];\n}"},{"id":4,"title":"寻找两个正序数组的中位数","en":"Median of Two Sorted Arrays","slug":"median-of-two-sorted-arrays","difficulty":"hard","category":"二分查找","tags":["数组","二分查找"],"summary":"在较短的数组上二分切分点，让左半边的最大值不大于右半边的最小值。","description":["给定两个已经按非降序排列的数组 nums1 和 nums2，大小分别为 m 和 n。找出这两个数组合并后的中位数。","要求算法时间复杂度是 O(log(m+n))。合并后的数组长度为奇数时，中位数是中间那个数；长度为偶数时，中位数是中间两个数的平均值。"],"examples":[{"input":"nums1 = [1,3], nums2 = [2]","output":"2.00000"},{"input":"nums1 = [1,2], nums2 = [3,4]","output":"2.50000"}],"constraints":["nums1.length == m","nums2.length == n","0 \u003c= m, n \u003c= 1000","1 \u003c= m + n \u003c= 2000","-10^6 \u003c= nums1[i], nums2[i] \u003c= 10^6"],"essence":[{"title":"切在较短数组上","body":"让 nums1 是较短的那个。二分它的左半个数 i，另一个数组的左半个数就是 totalLeft-i。"},{"title":"合法切分","body":"nums1 左最大不超过 nums2 右最小，并且 nums2 左最大不超过 nums1 右最小。"},{"title":"边界用哨兵","body":"某一侧没有元素时，左最大看成很小的数，右最小看成很大的数。元素范围在 10^6 内，哨兵取 10^9 就够。"}],"solution":["合并后左半边应该有 (m+n+1)/2 个元素。这样奇数长度时中位数就是左半边的最大值，偶数长度时还要和右半边的最小值取平均。","在较短数组上二分左半边取多少个元素。切分不合法时，如果 nums1 的左最大大于 nums2 的右最小，说明 nums1 取多了，向左收缩；否则向右收缩。","找到合法切分后，左半最大值和右半最小值就能算出中位数。这个过程只对较短数组做二分，复杂度是 O(log min(m,n))，满足要求。"],"traces":[{"input":"nums1 = [1,3], nums2 = [2]","output":"2","steps":["合并后有 3 个数，左半边要放 2 个。二分只切较短的数组，这里较短的是 `[2]`。","先让 `[2]` 一个都不进左半，那么 `[1,3]` 的两个数都在左半，右半只剩 2。左半最大是 3，已经大于右边的 2，这一刀不合法。","把切分往右移：2 进入左半，`[1,3]` 只留 1 在左半。左半是 `{1,2}`，右半是 `{3}`。","左半最大的 2 不大于右半最小的 3。总数是奇数，中位数就是左半最大值 2。"],"figure":[{"kind":"array","caption":"较短的 [2] 放进左半","values":[2],"on":[0],"labels":{"0":"左半"}},{"kind":"array","caption":"较长数组左边留 1，右边是 3","values":[1,3],"on":[0],"alt":[1],"labels":{"0":"左半","1":"右半"}}]},{"input":"nums1 = [1,2], nums2 = [3,4]","output":"2.5","steps":["一共 4 个数，左半边放 2 个。合法的一刀是 `[1,2]` 都在左半，`[3,4]` 都在右半。","左半最大值是 2，右半最小值是 3。偶数个数取平均，`(2+3)/2=2.5`。"]}],"complexity":{"time":"O(log min(m,n))","space":"O(1)"},"go":"func findMedianSortedArrays(nums1 []int, nums2 []int) float64 {\n  if len(nums1) > len(nums2) {\n    return findMedianSortedArrays(nums2, nums1)\n  }\n  m, n := len(nums1), len(nums2)\n  totalLeft := (m + n + 1) / 2\n  left, right := 0, m\n  for left \u003c= right {\n    i := (left + right) / 2\n    j := totalLeft - i\n    nums1Left, nums1Right := -1000000000, 1000000000\n    nums2Left, nums2Right := -1000000000, 1000000000\n    if i > 0 {\n      nums1Left = nums1[i-1]\n    }\n    if i \u003c m {\n      nums1Right = nums1[i]\n    }\n    if j > 0 {\n      nums2Left = nums2[j-1]\n    }\n    if j \u003c n {\n      nums2Right = nums2[j]\n    }\n    if nums1Left \u003c= nums2Right && nums2Left \u003c= nums1Right {\n      if (m+n)%2 == 1 {\n        if nums1Left > nums2Left {\n          return float64(nums1Left)\n        }\n        return float64(nums2Left)\n      }\n      leftMax := nums1Left\n      if nums2Left > leftMax {\n        leftMax = nums2Left\n      }\n      rightMin := nums1Right\n      if nums2Right \u003c rightMin {\n        rightMin = nums2Right\n      }\n      return float64(leftMax+rightMin) / 2\n    }\n    if nums1Left > nums2Right {\n      right = i - 1\n    } else {\n      left = i + 1\n    }\n  }\n  return 0\n}","ts":"function findMedianSortedArrays(nums1: number[], nums2: number[]): number {\n  if (nums1.length > nums2.length) {\n    return findMedianSortedArrays(nums2, nums1);\n  }\n  const m = nums1.length;\n  const n = nums2.length;\n  const totalLeft = Math.floor((m + n + 1) / 2);\n  let left = 0;\n  let right = m;\n  while (left \u003c= right) {\n    const i = (left + right) >> 1;\n    const j = totalLeft - i;\n    const nums1Left = i === 0 ? -Infinity : nums1[i - 1];\n    const nums1Right = i === m ? Infinity : nums1[i];\n    const nums2Left = j === 0 ? -Infinity : nums2[j - 1];\n    const nums2Right = j === n ? Infinity : nums2[j];\n    if (nums1Left \u003c= nums2Right && nums2Left \u003c= nums1Right) {\n      if ((m + n) % 2 === 1) {\n        return Math.max(nums1Left, nums2Left);\n      }\n      return (Math.max(nums1Left, nums2Left) + Math.min(nums1Right, nums2Right)) / 2;\n    }\n    if (nums1Left > nums2Right) {\n      right = i - 1;\n    } else {\n      left = i + 1;\n    }\n  }\n  return 0;\n}"},{"id":20,"title":"有效的括号","en":"Valid Parentheses","slug":"valid-parentheses","difficulty":"easy","category":"栈","tags":["栈","字符串"],"summary":"左括号入栈，右括号必须和栈顶的左括号配对。","description":["给定一个只包含括号字符的字符串，判断它是否有效。","有效指左括号必须用相同类型的右括号闭合，并且要以正确的顺序闭合。空字符串有效。"],"examples":[{"input":"s = \"()\"","output":"true"},{"input":"s = \"()[]{}\"","output":"true"},{"input":"s = \"(]\"","output":"false"},{"input":"s = \"([)]\"","output":"false"}],"constraints":["1 \u003c= s.length \u003c= 10^4","s 只由括号字符组成"],"essence":[{"title":"后进先出","body":"最后出现且还没匹配的左括号，必须最先被右括号匹配。"},{"title":"三种失败","body":"栈空时来了右括号、栈顶类型不匹配、扫完后栈里还有左括号。"},{"title":"复杂度","body":"每个字符入栈出栈最多一次，时间 O(n)，空间 O(n)。"}],"solution":["用哈希表记录右括号对应的左括号。扫描字符串，遇到左括号就入栈。","遇到右括号时，如果栈为空或栈顶不是对应的左括号，返回假；否则弹出栈顶。","扫描结束后栈必须为空。这样 \"([)]\" 会在中途失败，\"(()\" 会在最后失败。"],"traces":[{"input":"s = \"()[]{}\"","output":"true","steps":["左括号依次入栈。读到 `)` 时栈顶正好是 `(`，弹出。","`]` 匹配栈顶 `[`，`}` 匹配栈顶 `{`。","扫描结束栈是空的，所有括号都正确闭合，返回 true。"],"figure":{"kind":"stack","caption":"读到右括号时，栈顶必须是对应的左括号","values":["(","["]}},{"input":"s = \"([)]\"","output":"false","steps":["`(` 和 `[` 入栈。下一个是 `)`，但栈顶是 `[`，类型对不上。","后出现的左括号必须先被匹配。这里交叉了，立刻返回 false。"]}],"complexity":{"time":"O(n)","space":"O(n)"},"go":"func isValid(s string) bool {\n  pair := map[byte]byte{')': '(', ']': '[', '}': '{'}\n  stack := make([]byte, 0)\n  for i := 0; i \u003c len(s); i++ {\n    if open, ok := pair[s[i]]; ok {\n      if len(stack) == 0 || stack[len(stack)-1] != open {\n        return false\n      }\n      stack = stack[:len(stack)-1]\n    } else {\n      stack = append(stack, s[i])\n    }\n  }\n  return len(stack) == 0\n}","ts":"function isValid(s: string): boolean {\n  const pair: Record\u003cstring, string> = { ')': '(', ']': '[', '}': '{' };\n  const stack: string[] = [];\n  for (const ch of s) {\n    if (pair[ch]) {\n      if (stack.pop() !== pair[ch]) {\n        return false;\n      }\n    } else {\n      stack.push(ch);\n    }\n  }\n  return stack.length === 0;\n}"},{"id":155,"title":"最小栈","en":"Min Stack","slug":"min-stack","difficulty":"medium","category":"栈","tags":["栈","设计"],"summary":"每个元素入栈时，同时记下从栈底到这里的最小值。","description":["设计一个支持 push、pop、top 和 getMin 的栈，所有操作的时间复杂度都是 O(1)。","getMin 返回栈中的最小元素。题目保证对空栈不会调用 pop、top 和 getMin。"],"examples":[{"input":"push(-2), push(0), push(-3), getMin, pop, top, getMin","output":"[null,null,null,-3,null,0,-2]"}],"constraints":["-2^31 \u003c= val \u003c= 2^31 - 1","pop、top 和 getMin 总在非空栈上调用","操作次数不超过 3 * 10^4"],"essence":[{"title":"同步最小值","body":"栈里每个位置保存值和“含自己在内的当前最小值”。getMin 直接读栈顶的最小值。"},{"title":"重复最小值","body":"新值等于旧最小值时也要再记一次。弹出后，下面那一层仍然记着这个最小值。"},{"title":"复杂度","body":"每个操作 O(1)，空间 O(n)。"}],"solution":["普通栈只能 O(1) 得到栈顶，找最小值需要扫描。辅助栈可以专门存最小值，但两个栈要同时 push 和 pop。","这里把值和当前最小值放进同一个二元组。push 时，新的最小值是 val 和旧栈顶最小值中的较小者。","pop 只删掉栈顶。下面的二元组已经保存了弹出之前的最小值，不需要重新计算。"],"traces":[{"input":"push(-2), push(0), push(-3), getMin, pop, top, getMin","output":"[-3,0,-2]","steps":["push(-2)，栈里保存值和当前最小值 `(-2,-2)`。","push(0) 不会刷新最小值，存 `(0,-2)`。push(-3) 刷新最小值，存 `(-3,-3)`。","getMin 直接读栈顶的最小值 -3。pop 后栈顶变回 `(0,-2)`，top 是 0，getMin 仍是 -2。","最小值跟着每一层一起记住，弹出后不用重新扫描。"],"figure":{"kind":"stack","caption":"每一层同时记下当时的最小值","values":["(-2, -2)","(0, -2)","(-3, -3)"]}},{"input":"push(1), push(1), pop, getMin","output":"1","steps":["两个 1 都要把最小值 1 再记一次。弹出上面的 1 后，下面那层仍保存着最小值 1，getMin 还是 1。","每个栈元素都保存当时的最小值。弹出上层后，下层记录的 1 还在，不需要再算一遍。"]}],"complexity":{"time":"O(1)","space":"O(n)"},"go":"type MinStack struct {\n  stack [][2]int\n}\n\nfunc Constructor() MinStack {\n  return MinStack{}\n}\n\nfunc (s *MinStack) Push(val int) {\n  mn := val\n  if len(s.stack) > 0 && s.stack[len(s.stack)-1][1] \u003c mn {\n    mn = s.stack[len(s.stack)-1][1]\n  }\n  s.stack = append(s.stack, [2]int{val, mn})\n}\n\nfunc (s *MinStack) Pop() {\n  s.stack = s.stack[:len(s.stack)-1]\n}\n\nfunc (s *MinStack) Top() int {\n  return s.stack[len(s.stack)-1][0]\n}\n\nfunc (s *MinStack) GetMin() int {\n  return s.stack[len(s.stack)-1][1]\n}","ts":"class MinStack {\n  private stack: number[][];\n\n  constructor() {\n    this.stack = [];\n  }\n\n  push(val: number): void {\n    const prev = this.stack.length === 0 ? val : this.stack[this.stack.length - 1][1];\n    this.stack.push([val, Math.min(prev, val)]);\n  }\n\n  pop(): void {\n    this.stack.pop();\n  }\n\n  top(): number {\n    return this.stack[this.stack.length - 1][0];\n  }\n\n  getMin(): number {\n    return this.stack[this.stack.length - 1][1];\n  }\n}","note":"类名和方法名与力扣模板一致。"},{"id":394,"title":"字符串解码","en":"Decode String","slug":"decode-string","difficulty":"medium","category":"栈","tags":["栈","字符串"],"summary":"遇到左括号就把当前数字和当前字符串压栈，右括号时弹出并重复拼接。","description":["给定一个编码字符串，按规则解码。k[encoded] 表示方括号内的字符串重复 k 次。k 是正整数。","输入保证合法，方括号匹配，数字只出现在方括号前面。可以嵌套。"],"examples":[{"input":"s = \"3[a]2[bc]\"","output":"\"aaabcbc\""},{"input":"s = \"3[a2[c]]\"","output":"\"accaccacc\""},{"input":"s = \"2[abc]3[cd]ef\"","output":"\"abcabccdcdcdef\""}],"constraints":["1 \u003c= s.length \u003c= 30","s 由小写字母、数字和方括号组成","输出长度不超过 10^5"],"essence":[{"title":"两套栈","body":"数字栈保存重复次数，字符串栈保存进入括号前已经解码好的前缀。"},{"title":"数字可能多位","body":"连续数字要按十进制累加，不能每个字符单独当次数。"},{"title":"复杂度","body":"每个输出字符只生成一次，时间与输出长度成正比。"}],"solution":["从左到右扫描。数字累加成 k。遇到左括号时，把 k 和当前字符串压栈，然后把 k 和当前字符串清空，开始收集括号内的内容。","遇到右括号时，弹出次数和之前的前缀。当前字符串重复相应次数后接到前缀后面，成为新的当前字符串。","普通字母直接追加到当前字符串。嵌套括号因为后进先出，内层会先被解码。"],"traces":[{"input":"s = \"3[a2[c]]\"","output":"\"accaccacc\"","steps":["读到 3 和 `[`，把次数 3、以及括号前的空字符串压栈，开始收集括号里面的内容。","里面又读到 2 和 `[`。再压一次栈，收集到 `c`。右括号把它重复 2 次，接回外层，当前字符串变成 `acc`。","外层右括号把 `acc` 重复 3 次，得到 `accaccacc`。","数字 10 这种多位数字要先累加成十进制，不能把 1 和 0 分成两次重复。"],"figure":{"kind":"window","caption":"内层 cc 先拼好，再被外层重复 3 次","text":"accaccacc","ranges":[[0,2],[3,5],[6,8]]}},{"input":"s = \"2[abc]3[cd]ef\"","output":"\"abcabccdcdcdef\"","steps":["`abc` 重复 2 次得到 `abcabc`。接下来是另一段独立的 `3[cd]`，重复后接上，变成 `abcabccdcdcd`。","最后的 `ef` 不在括号里，原样接在末尾。"]}],"complexity":{"time":"O(输出长度)","space":"O(n)"},"go":"func decodeString(s string) string {\n  numStack := make([]int, 0)\n  strStack := make([]string, 0)\n  cur := \"\"\n  k := 0\n  for i := 0; i \u003c len(s); i++ {\n    ch := s[i]\n    switch {\n    case ch >= '0' && ch \u003c= '9':\n      k = k*10 + int(ch-'0')\n    case ch == '[':\n      numStack = append(numStack, k)\n      strStack = append(strStack, cur)\n      k = 0\n      cur = \"\"\n    case ch == ']':\n      n := numStack[len(numStack)-1]\n      numStack = numStack[:len(numStack)-1]\n      prev := strStack[len(strStack)-1]\n      strStack = strStack[:len(strStack)-1]\n      cur = prev + strings.Repeat(cur, n)\n    default:\n      cur += string(ch)\n    }\n  }\n  return cur\n}","ts":"function decodeString(s: string): string {\n  const numStack: number[] = [];\n  const strStack: string[] = [];\n  let cur = '';\n  let k = 0;\n  for (const ch of s) {\n    if (ch >= '0' && ch \u003c= '9') {\n      k = k * 10 + Number(ch);\n    } else if (ch === '[') {\n      numStack.push(k);\n      strStack.push(cur);\n      k = 0;\n      cur = '';\n    } else if (ch === ']') {\n      const times = numStack.pop() as number;\n      const prev = strStack.pop() as string;\n      cur = prev + cur.repeat(times);\n    } else {\n      cur += ch;\n    }\n  }\n  return cur;\n}"},{"id":739,"title":"每日温度","en":"Daily Temperatures","slug":"daily-temperatures","difficulty":"medium","category":"栈","tags":["单调栈"],"summary":"单调递减栈保存还没等到更高温度的下标。来了更高温度就逐个结算。","description":["给定每天的温度数组 temperatures。返回一个数组 answer，answer[i] 是第 i 天之后要等多少天才会出现更高的温度。","如果之后都不会更高，answer[i] 为 0。"],"examples":[{"input":"temperatures = [73,74,75,71,69,72,76,73]","output":"[1,1,4,2,1,1,0,0]"},{"input":"temperatures = [30,40,50,60]","output":"[1,1,1,0]"},{"input":"temperatures = [30,60,90]","output":"[1,1,0]"}],"constraints":["1 \u003c= temperatures.length \u003c= 10^5","30 \u003c= temperatures[i] \u003c= 100"],"essence":[{"title":"栈内温度递减","body":"栈里保存下标。新的一天比栈顶更热时，栈顶那天等到的就是今天。"},{"title":"距离是下标差","body":"答案是 i - stackTop，不是温度差。"},{"title":"复杂度","body":"每个下标最多入栈出栈一次，时间 O(n)。"}],"solution":["从左到右扫描。对于第 i 天，只要栈不为空且栈顶温度小于今天，就弹出栈顶并写下等待天数。","然后把今天的下标入栈。没有被弹出的日子，后面没有更热的温度，答案保持初值 0。","栈里温度从底到顶递减，所以一旦栈顶不比今天冷，下面的更热，可以停止弹出。"],"traces":[{"input":"temperatures = [73,74,75,71,69,72,76,73]","output":"[1,1,4,2,1,1,0,0]","steps":["73 入栈。74 比它高，73 只等 1 天。74 自己入栈后，75 又比它高，74 也只等 1 天。","75 还在栈里。71 和 69 都更低，先压住。72 比 69 和 71 高，分别结算出 1 天和 2 天，但 72 仍低于 75。","76 比 72 和 75 都高。75 从下标 2 等到下标 6，距离是 4。","76 和最后的 73 后面没有更高的温度，答案保持 0。"],"figure":{"kind":"bars","caption":"75 要一直等到后面的 76，距离 4 天","values":[73,74,75,71,69,72,76,73],"on":[2],"alt":[6],"labels":{"2":"起点","6":"更热"}}},{"input":"temperatures = [30,40,50,60]","output":"[1,1,1,0]","steps":["每一天都比前一天高，栈顶立刻被结算。前三天都只等 1 天，最后一天没有更热的后续，是 0。","栈里的下标会被下一天立刻弹出。最后一天入栈后再也没有更高温度来结算它。"]}],"complexity":{"time":"O(n)","space":"O(n)"},"go":"func dailyTemperatures(temperatures []int) []int {\n  n := len(temperatures)\n  ans := make([]int, n)\n  stack := make([]int, 0)\n  for i, temp := range temperatures {\n    for len(stack) > 0 && temperatures[stack[len(stack)-1]] \u003c temp {\n      j := stack[len(stack)-1]\n      stack = stack[:len(stack)-1]\n      ans[j] = i - j\n    }\n    stack = append(stack, i)\n  }\n  return ans\n}","ts":"function dailyTemperatures(temperatures: number[]): number[] {\n  const ans = new Array\u003cnumber>(temperatures.length).fill(0);\n  const stack: number[] = [];\n  for (let i = 0; i \u003c temperatures.length; i += 1) {\n    while (stack.length > 0 && temperatures[stack[stack.length - 1]] \u003c temperatures[i]) {\n      const j = stack.pop() as number;\n      ans[j] = i - j;\n    }\n    stack.push(i);\n  }\n  return ans;\n}"},{"id":84,"title":"柱状图中最大的矩形","en":"Largest Rectangle in Histogram","slug":"largest-rectangle-in-histogram","difficulty":"hard","category":"栈","tags":["单调栈"],"summary":"每根柱子向左右扩展，直到遇到更矮的柱子。单调栈一次求出这两个边界。","description":["给定 n 个非负整数，表示柱状图中每个柱子的高度，柱子宽度都是 1。求能勾勒出来的矩形的最大面积。"],"examples":[{"input":"heights = [2,1,5,6,2,3]","output":"10","note":"高度 5 和 6 组成的矩形面积是 10。"},{"input":"heights = [2,4]","output":"4"}],"constraints":["1 \u003c= heights.length \u003c= 10^5","0 \u003c= heights[i] \u003c= 10^4"],"essence":[{"title":"以每根柱子为高","body":"最大矩形一定以某根柱子的高度为高，并且向两边扩展到第一个更矮的柱子之前。"},{"title":"哨兵 0","body":"末尾补一根高度 0 的柱子，保证栈里剩余柱子最终都会被结算。"},{"title":"相等高度","body":"弹出条件使用大于等于。相等的柱子由更右边的那根负责覆盖整段宽度。"}],"solution":["在高度数组末尾追加 0，栈里先放一个哨兵下标 -1。栈中下标对应的高度保持递增。","扫描每根柱子。当栈顶柱子高于或等于当前柱子时，栈顶不能再向右扩展，弹出它。它的右边界是当前下标，左边界是新的栈顶，宽度是 right-left-1。","用高度乘宽度更新答案。最后哨兵 0 会把栈清空。相等高度不会被拆成更小的面积，因为右侧相等柱子弹出时宽度会覆盖左侧。"],"traces":[{"input":"heights = [2,1,5,6,2,3]","output":"10","steps":["在末尾补一根高度 0。栈里先放哨兵下标 -1。","2 被后面的 1 挡住，只能单独成矩形，面积 2。1 先留在栈里。","5 和 6 递增。到 2 时，6 只能向左扩 1 格，面积 6；5 可以向左扩到下标 1 之前，宽度 2，面积 10。","最后的 0 会把剩下的柱子全部结算，高度 2 的宽度是 4，面积 8，仍小于 10。最大面积是 10。"],"figure":{"kind":"bars","caption":"高度 5 向右覆盖两格，面积 10","values":[2,1,5,6,2,3],"on":[2,3],"shade":{"from":2,"to":3,"height":5}}},{"input":"heights = [2,2]","output":"4","steps":["两根一样高。弹出左边那根时宽度只有 1；弹出右边那根时，左边界是哨兵，宽度是 2，面积 `2*2=4`。相等的柱子不会把整段矩形拆丢。","末尾哨兵 0 比两根柱子都矮，会把它们都弹出来。右边那根弹出时宽度覆盖两格，面积是 4。"]}],"complexity":{"time":"O(n)","space":"O(n)"},"go":"func largestRectangleArea(heights []int) int {\n  heights = append(heights, 0)\n  stack := []int{-1}\n  best := 0\n  for i, h := range heights {\n    for len(stack) > 1 && heights[stack[len(stack)-1]] >= h {\n      height := heights[stack[len(stack)-1]]\n      stack = stack[:len(stack)-1]\n      width := i - stack[len(stack)-1] - 1\n      if height*width > best {\n        best = height * width\n      }\n    }\n    stack = append(stack, i)\n  }\n  return best\n}","ts":"function largestRectangleArea(heights: number[]): number {\n  const bars = heights.concat(0);\n  const stack = [-1];\n  let best = 0;\n  for (let i = 0; i \u003c bars.length; i += 1) {\n    while (stack.length > 1 && bars[stack[stack.length - 1]] >= bars[i]) {\n      const height = bars[stack.pop() as number];\n      const width = i - stack[stack.length - 1] - 1;\n      best = Math.max(best, height * width);\n    }\n    stack.push(i);\n  }\n  return best;\n}"},{"id":215,"title":"数组中的第 K 个最大元素","en":"Kth Largest Element in an Array","slug":"kth-largest-element-in-an-array","difficulty":"medium","category":"堆","tags":["堆","快速选择"],"summary":"维护一个大小为 k 的小根堆，堆顶就是当前看到的第 k 大。","description":["给定整数数组 nums 和整数 k，返回数组中第 k 个最大的元素。","第 k 大指排序后从大到小的第 k 个，不是第 k 个不同的元素。"],"examples":[{"input":"nums = [3,2,1,5,6,4], k = 2","output":"5"},{"input":"nums = [3,2,3,1,2,4,5,5,6], k = 4","output":"4"}],"constraints":["1 \u003c= k \u003c= nums.length \u003c= 10^5","-10^4 \u003c= nums[i] \u003c= 10^4"],"essence":[{"title":"小根堆保留最大的 k 个","body":"堆大小超过 k 就弹出最小的。最后堆里是最大的 k 个数，堆顶是其中最小的，也就是第 k 大。"},{"title":"快速选择","body":"按从大到小的第 k 个位置做划分，平均 O(n)，最坏 O(n^2)。堆是稳定的 O(n log k)。"},{"title":"复杂度","body":"这里使用大小为 k 的堆，时间 O(n log k)，空间 O(k)。"}],"solution":["建立一个小根堆。每个数入堆，堆大小超过 k 时弹出堆顶。","遍历结束后，堆顶就是第 k 大。k 等于 1 时，堆里只保留最大值。k 等于数组长度时，堆顶是最小值，也就是第 n 大。","完全排序是 O(n log n)，在 k 远小于 n 时不如固定大小的堆。"],"traces":[{"input":"nums = [3,2,1,5,6,4], k = 2","output":"5","steps":["小根堆只保留最大的 2 个数。先放 3、2，堆顶是 2。","1 比堆顶小，放进去后又被弹出。5 进来后弹出 2，堆里是 3 和 5，堆顶 3。","6 进来后弹出 3。4 进来后弹出 4 自己。最后堆里是 5 和 6。","堆顶 5 就是第 2 大。完整排序后从大到小是 6、5、4、3、2、1，第二名确实是 5。"],"figure":{"kind":"array","caption":"大小为 2 的小根堆，堆顶就是第 2 大","values":[5,6],"on":[0],"labels":{"0":"堆顶"}}},{"input":"nums = [3,2,3,1,2,4,5,5,6], k = 4","output":"4","steps":["堆大小维持 4。最小的数会被陆续挤出，最后留下 6、5、5、4。","这四个里最小的是 4，也就是第 4 大。重复的 5 各自占一个名次。"]}],"complexity":{"time":"O(n log k)","space":"O(k)"},"go":"type kthHeap []int\n\nfunc (h kthHeap) Len() int           { return len(h) }\nfunc (h kthHeap) Less(i, j int) bool { return h[i] \u003c h[j] }\nfunc (h kthHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *kthHeap) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *kthHeap) Pop() any {\n  old := *h\n  x := old[len(old)-1]\n  *h = old[:len(old)-1]\n  return x\n}\n\nfunc findKthLargest(nums []int, k int) int {\n  h := &kthHeap{}\n  for _, x := range nums {\n    heap.Push(h, x)\n    if h.Len() > k {\n      heap.Pop(h)\n    }\n  }\n  return (*h)[0]\n}","ts":"function findKthLargest(nums: number[], k: number): number {\n  const heap = new MinHeap();\n  for (const value of nums) {\n    heap.push(value);\n    if (heap.size > k) {\n      heap.pop();\n    }\n  }\n  return heap.peek();\n}\n\nclass MinHeap {\n  private data: number[] = [];\n\n  get size(): number {\n    return this.data.length;\n  }\n\n  peek(): number {\n    return this.data[0];\n  }\n\n  push(value: number): void {\n    this.data.push(value);\n    this.siftUp(this.data.length - 1);\n  }\n\n  pop(): number {\n    const top = this.data[0];\n    const last = this.data.pop() as number;\n    if (this.data.length > 0) {\n      this.data[0] = last;\n      this.siftDown(0);\n    }\n    return top;\n  }\n\n  private siftUp(index: number): void {\n    while (index > 0) {\n      const parent = (index - 1) >> 1;\n      if (this.data[index] >= this.data[parent]) {\n        break;\n      }\n      this.swap(index, parent);\n      index = parent;\n    }\n  }\n\n  private siftDown(index: number): void {\n    const n = this.data.length;\n    while (true) {\n      let best = index;\n      const left = index * 2 + 1;\n      const right = left + 1;\n      if (left \u003c n && this.data[left] \u003c this.data[best]) {\n        best = left;\n      }\n      if (right \u003c n && this.data[right] \u003c this.data[best]) {\n        best = right;\n      }\n      if (best === index) {\n        break;\n      }\n      this.swap(index, best);\n      index = best;\n    }\n  }\n\n  private swap(i: number, j: number): void {\n    const tmp = this.data[i];\n    this.data[i] = this.data[j];\n    this.data[j] = tmp;\n  }\n}"},{"id":347,"title":"前 K 个高频元素","en":"Top K Frequent Elements","slug":"top-k-frequent-elements","difficulty":"medium","category":"堆","tags":["哈希表","桶排序","堆"],"summary":"先计数，再按出现次数放进桶里。从高频桶往回取满 k 个。","description":["给定整数数组 nums 和整数 k，返回出现频率前 k 高的元素。答案顺序不限。","题目保证答案唯一，也就是频率第 k 高的元素不会和后面的元素频率相同。"],"examples":[{"input":"nums = [1,1,1,2,2,3], k = 2","output":"[1,2]"},{"input":"nums = [1], k = 1","output":"[1]"}],"constraints":["1 \u003c= nums.length \u003c= 10^5","-10^4 \u003c= nums[i] \u003c= 10^4","k 的取值范围是 [1, 不同数字的个数]","答案唯一"],"essence":[{"title":"频率当桶下标","body":"一个数最多出现 n 次。桶 i 存放出现 i 次的所有数字。"},{"title":"比堆更快","body":"堆是 O(n log k)。桶排序计数后是 O(n)，满足进阶要求。"},{"title":"复杂度","body":"时间 O(n)，空间 O(n)。"}],"solution":["先用哈希表统计每个数字的出现次数。","创建 n+1 个桶。把数字放进它的频率所在的桶。然后从频率 n 往频率 1 扫描，依次收集数字，直到收集满 k 个。","因为答案唯一，收集过程不会在两个相同频率之间产生歧义。返回时如果最后一个桶使结果超过 k，截断到 k 个。"],"traces":[{"input":"nums = [1,1,1,2,2,3], k = 2","output":"[1,2]","steps":["计数是 `1:3, 2:2, 3:1`。","1 放进 3 号桶，2 放进 2 号桶，3 放进 1 号桶。","从最高频往回取。先拿到 1，再拿到 2，已经够 2 个。3 不用再取。"],"figure":{"kind":"array","caption":"1 出现 3 次，2 出现 2 次，先从高频桶取出","values":[1,1,1,2,2,3],"on":[0,1,2],"alt":[3,4]}},{"input":"nums = [1], k = 1","output":"[1]","steps":["只有一个数，频率是 1。最高的桶里就是它，取 1 个后结束。","桶的下标就是出现次数。从最高桶取出这一个数后，k 已经满足。"]}],"complexity":{"time":"O(n)","space":"O(n)"},"go":"func topKFrequent(nums []int, k int) []int {\n  freq := map[int]int{}\n  for _, x := range nums {\n    freq[x]++\n  }\n  buckets := make([][]int, len(nums)+1)\n  for value, count := range freq {\n    buckets[count] = append(buckets[count], value)\n  }\n  ans := make([]int, 0, k)\n  for count := len(buckets) - 1; count >= 0 && len(ans) \u003c k; count-- {\n    ans = append(ans, buckets[count]...)\n  }\n  return ans[:k]\n}","ts":"function topKFrequent(nums: number[], k: number): number[] {\n  const freq = new Map\u003cnumber, number>();\n  for (const value of nums) {\n    freq.set(value, (freq.get(value) ?? 0) + 1);\n  }\n  const buckets: number[][] = Array.from({ length: nums.length + 1 }, () => []);\n  for (const [value, count] of freq) {\n    buckets[count].push(value);\n  }\n  const ans: number[] = [];\n  for (let count = buckets.length - 1; count >= 0 && ans.length \u003c k; count -= 1) {\n    ans.push(...buckets[count]);\n  }\n  return ans.slice(0, k);\n}"},{"id":295,"title":"数据流的中位数","en":"Find Median from Data Stream","slug":"find-median-from-data-stream","difficulty":"hard","category":"堆","tags":["堆","设计"],"summary":"大根堆保存较小的一半，小根堆保存较大的一半，两边数量最多差 1。","description":["设计一个数据结构，支持从数据流中添加整数，并能随时取出当前所有元素的中位数。","元素个数为奇数时，中位数是排序后中间的数；为偶数时，中位数是中间两个数的平均值。"],"examples":[{"input":"addNum(1), addNum(2), findMedian(), addNum(3), findMedian()","output":"[null,null,1.5,null,2.0]"}],"constraints":["-10^5 \u003c= num \u003c= 10^5","在调用 findMedian 之前至少添加过一个数","addNum 和 findMedian 的调用次数总和不超过 5 * 10^4"],"essence":[{"title":"两堆分工","body":"lo 是大根堆，保存较小的一半，堆顶是这一半的最大值。hi 是小根堆，保存较大的一半。"},{"title":"数量差","body":"约定 lo 的数量等于 hi，或者只比 hi 多 1。奇数时中位数是 lo 的堆顶。"},{"title":"复杂度","body":"每次插入 O(log n)，查询 O(1)。"}],"solution":["新数字先放进 lo，再把 lo 的最大值弹出并放进 hi。这样 hi 里的每个数都不小于 lo 里的数。","如果 hi 的数量超过 lo，就把 hi 的最小值弹回 lo。调整后 lo 永远不少于 hi，并且最多多一个。","查询时，数量不等就返回 lo 的堆顶；数量相等就返回两个堆顶的平均值。"],"traces":[{"input":"依次加入 1、2、3","output":"[1.5, 2]","steps":["加入 1。它先进入较小一半，再被调整到较大一半，最后因为两边不平衡，又回到较小一半。较小一半是 `[1]`，中位数 1。","加入 2。较小一半暂时变成 `[2,1]`，把最大值 2 送进较大一半。两边各一个，中位数是 `(1+2)/2=1.5`。","加入 3。3 最终留在较大一半，再把较大一半的最小值 2 送回较小一半。较小一半是 `[2,1]`，个数更多，中位数是堆顶 2。"],"figure":[{"kind":"array","caption":"较小一半的堆顶是 2","values":[2,1],"on":[0],"labels":{"0":"大根堆顶"}},{"kind":"array","caption":"较大一半只有 3","values":[3],"on":[0],"labels":{"0":"小根堆顶"}}]},{"input":"在上面的基础上再加入 4、5","output":"[2.5, 3]","steps":["加入 4 后两边数量相等，堆顶是 2 和 3，中位数 2.5。","加入 5 后较小一半多一个，堆顶变成 3。数据流的中位数始终只看两个堆顶，不用把所有数重新排序。"]}],"complexity":{"time":"O(log n)","space":"O(n)"},"go":"type lowHeap []int\n\nfunc (h lowHeap) Len() int           { return len(h) }\nfunc (h lowHeap) Less(i, j int) bool { return h[i] > h[j] }\nfunc (h lowHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *lowHeap) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *lowHeap) Pop() any {\n  old := *h\n  x := old[len(old)-1]\n  *h = old[:len(old)-1]\n  return x\n}\n\ntype highHeap []int\n\nfunc (h highHeap) Len() int           { return len(h) }\nfunc (h highHeap) Less(i, j int) bool { return h[i] \u003c h[j] }\nfunc (h highHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *highHeap) Push(x any)        { *h = append(*h, x.(int)) }\nfunc (h *highHeap) Pop() any {\n  old := *h\n  x := old[len(old)-1]\n  *h = old[:len(old)-1]\n  return x\n}\n\ntype MedianFinder struct {\n  lo lowHeap\n  hi highHeap\n}\n\nfunc Constructor() MedianFinder {\n  return MedianFinder{}\n}\n\nfunc (mf *MedianFinder) AddNum(num int) {\n  heap.Push(&mf.lo, num)\n  heap.Push(&mf.hi, heap.Pop(&mf.lo))\n  if mf.lo.Len() \u003c mf.hi.Len() {\n    heap.Push(&mf.lo, heap.Pop(&mf.hi))\n  }\n}\n\nfunc (mf *MedianFinder) FindMedian() float64 {\n  if mf.lo.Len() > mf.hi.Len() {\n    return float64(mf.lo[0])\n  }\n  return float64(mf.lo[0]+mf.hi[0]) / 2\n}","ts":"class MedianFinder {\n  private lo: OrderHeap;\n  private hi: OrderHeap;\n\n  constructor() {\n    this.lo = new OrderHeap((a, b) => a > b);\n    this.hi = new OrderHeap((a, b) => a \u003c b);\n  }\n\n  addNum(num: number): void {\n    this.lo.push(num);\n    this.hi.push(this.lo.pop());\n    if (this.lo.size \u003c this.hi.size) {\n      this.lo.push(this.hi.pop());\n    }\n  }\n\n  findMedian(): number {\n    if (this.lo.size > this.hi.size) {\n      return this.lo.peek();\n    }\n    return (this.lo.peek() + this.hi.peek()) / 2;\n  }\n}\n\nclass OrderHeap {\n  private data: number[] = [];\n\n  constructor(private before: (a: number, b: number) => boolean) {}\n\n  get size(): number {\n    return this.data.length;\n  }\n\n  peek(): number {\n    return this.data[0];\n  }\n\n  push(value: number): void {\n    this.data.push(value);\n    this.siftUp(this.data.length - 1);\n  }\n\n  pop(): number {\n    const top = this.data[0];\n    const last = this.data.pop() as number;\n    if (this.data.length > 0) {\n      this.data[0] = last;\n      this.siftDown(0);\n    }\n    return top;\n  }\n\n  private siftUp(index: number): void {\n    while (index > 0) {\n      const parent = (index - 1) >> 1;\n      if (!this.before(this.data[index], this.data[parent])) {\n        break;\n      }\n      this.swap(index, parent);\n      index = parent;\n    }\n  }\n\n  private siftDown(index: number): void {\n    const n = this.data.length;\n    while (true) {\n      let best = index;\n      const left = index * 2 + 1;\n      const right = left + 1;\n      if (left \u003c n && this.before(this.data[left], this.data[best])) {\n        best = left;\n      }\n      if (right \u003c n && this.before(this.data[right], this.data[best])) {\n        best = right;\n      }\n      if (best === index) {\n        break;\n      }\n      this.swap(index, best);\n      index = best;\n    }\n  }\n\n  private swap(i: number, j: number): void {\n    const tmp = this.data[i];\n    this.data[i] = this.data[j];\n    this.data[j] = tmp;\n  }\n}","note":"类名和方法名与力扣模板一致。"},{"id":121,"title":"买卖股票的最佳时机","en":"Best Time to Buy and Sell Stock","slug":"best-time-to-buy-and-sell-stock","difficulty":"easy","category":"贪心","tags":["数组","贪心"],"summary":"一边记录历史最低价，一边用今天的价格减最低价更新利润。","description":["给定数组 prices，prices[i] 是第 i 天的股票价格。只允许完成一次买入和一次卖出，买入必须在卖出之前。","返回能获得的最大利润。如果不能获得正利润，返回 0。"],"examples":[{"input":"prices = [7,1,5,3,6,4]","output":"5","note":"第 2 天买入，第 5 天卖出。"},{"input":"prices = [7,6,4,3,1]","output":"0"}],"constraints":["1 \u003c= prices.length \u003c= 10^5","0 \u003c= prices[i] \u003c= 10^4"],"essence":[{"title":"今天卖出的最好买点","body":"如果决定在今天卖出，买入价就应该是今天之前的最低价。"},{"title":"不交易","body":"利润初始化为 0。价格一路下跌时，所有差价都是负的，答案保持 0。"},{"title":"复杂度","body":"一次扫描，时间 O(n)，空间 O(1)。"}],"solution":["用 minPrice 记录扫描过程中见过的最低价格，初始为第一天的价格。","每一天如果价格更低，就更新最低价；否则用当前价格减去最低价，尝试更新最大利润。","因为最低价只来自当前天之前，卖出日一定在买入日之后。"],"traces":[{"input":"prices = [7,1,5,3,6,4]","output":"5","steps":["第一天价格 7，最低价先记成 7，利润 0。","第二天 1 更低，买入价改成 1。后面如果卖出，都用 1 当成本。","第五天 5，利润 `5-1=4`。第五天其实是下标 4 的 6，利润 `6-1=5`。","最后的 4 只能得到利润 3。最大是 5，买入日在卖出日之前。"],"figure":{"kind":"bars","caption":"第 2 天买入，第 5 天卖出","values":[7,1,5,3,6,4],"on":[1],"alt":[4],"labels":{"1":"买入","4":"卖出"}}},{"input":"prices = [7,6,4,3,1]","output":"0","steps":["每天的价格都在创新低。最低价一直被更新，但没有一天高于之前的最低价，利润保持 0。","最低价每天都被刷新，但卖出价没有高于它。利润的初始值 0 不会被负数替换。"]}],"complexity":{"time":"O(n)","space":"O(1)"},"go":"func maxProfit(prices []int) int {\n  minPrice := prices[0]\n  best := 0\n  for _, price := range prices {\n    if price \u003c minPrice {\n      minPrice = price\n    } else if price-minPrice > best {\n      best = price - minPrice\n    }\n  }\n  return best\n}","ts":"function maxProfit(prices: number[]): number {\n  let minPrice = prices[0];\n  let best = 0;\n  for (const price of prices) {\n    if (price \u003c minPrice) {\n      minPrice = price;\n    } else {\n      best = Math.max(best, price - minPrice);\n    }\n  }\n  return best;\n}"},{"id":55,"title":"跳跃游戏","en":"Jump Game","slug":"jump-game","difficulty":"medium","category":"贪心","tags":["贪心","数组"],"summary":"维护目前能到达的最远下标。某个位置已经超过这个最远距离，就到不了终点。","description":["给定非负整数数组 nums，你最初位于第一个下标。数组中的每个元素表示你在该位置可以跳跃的最大长度。","判断能否到达最后一个下标。"],"examples":[{"input":"nums = [2,3,1,1,4]","output":"true"},{"input":"nums = [3,2,1,0,4]","output":"false"}],"constraints":["1 \u003c= nums.length \u003c= 10^4","0 \u003c= nums[i] \u003c= 10^5"],"essence":[{"title":"最远可达","body":"站在 i 时，如果 i 本身可达，就能把可达范围更新到 i+nums[i]。"},{"title":"提前失败","body":"遍历到 i 时发现 i 大于当前最远距离，后面的位置更不可能到达。"},{"title":"复杂度","body":"时间 O(n)，空间 O(1)。"}],"solution":["设 farthest 为目前能到达的最大下标。从左到右扫描。","如果当前下标已经大于 farthest，说明这段路断了，返回假。否则用 i+nums[i] 更新 farthest。","扫描能顺利走到最后，或者 farthest 中途已经覆盖末尾，都说明可以到达。只有一个元素时，人已经在终点，答案为真。"],"traces":[{"input":"nums = [2,3,1,1,4]","output":"true","steps":["下标 0 最远能到 2。下标 1 的值是 3，把最远距离更新到 `1+3=4`，已经覆盖末尾。","后面的格子都没有超过这个最远距离，所以走得到最后。"],"figure":{"kind":"array","caption":"下标 1 能跳到末尾","values":[2,3,1,1,4],"on":[1],"alt":[4],"labels":{"1":"最远到 4"}}},{"input":"nums = [3,2,1,0,4]","output":"false","steps":["下标 0、1、2 最远只能把边界推到下标 3。下标 3 的值是 0，最远仍是 3。","下标 4 已经大于最远距离 3，这一格本身到不了，返回 false。"],"figure":{"kind":"array","caption":"下标 3 的 0 把路截断","values":[3,2,1,0,4],"alt":[4],"hot":[3],"labels":{"3":"到不了后面"}}}],"complexity":{"time":"O(n)","space":"O(1)"},"go":"func canJump(nums []int) bool {\n  farthest := 0\n  for i := 0; i \u003c len(nums); i++ {\n    if i > farthest {\n      return false\n    }\n    if i+nums[i] > farthest {\n      farthest = i + nums[i]\n    }\n  }\n  return true\n}","ts":"function canJump(nums: number[]): boolean {\n  let farthest = 0;\n  for (let i = 0; i \u003c nums.length; i += 1) {\n    if (i > farthest) {\n      return false;\n    }\n    farthest = Math.max(farthest, i + nums[i]);\n  }\n  return true;\n}"},{"id":45,"title":"跳跃游戏 II","en":"Jump Game II","slug":"jump-game-ii","difficulty":"medium","category":"贪心","tags":["贪心","数组"],"summary":"在当前这一跳的覆盖范围内，选出能让下一跳覆盖得最远的位置。","description":["给定非负整数数组 nums，最初位于第一个下标。每个元素表示在该位置可以跳跃的最大长度。","返回到达最后一个下标的最少跳跃次数。题目保证一定可以到达。"],"examples":[{"input":"nums = [2,3,1,1,4]","output":"2"},{"input":"nums = [2,3,0,1,4]","output":"2"}],"constraints":["1 \u003c= nums.length \u003c= 10^4","0 \u003c= nums[i] \u003c= 1000","保证可以到达最后一个下标"],"essence":[{"title":"当前跳的边界","body":"end 是这一跳最远能到的位置。走到 end 时必须再跳一次，并把 end 更新成这一段里看到的最远位置。"},{"title":"不到终点不计数","body":"循环只到倒数第二个下标。人已经站在终点时不需要再跳。"},{"title":"复杂度","body":"时间 O(n)，空间 O(1)。"}],"solution":["维护当前跳跃能覆盖到的右端 end，以及在覆盖范围内看到的最远位置 farthest。","遍历到 end 时，说明这一跳的选择已经结束，跳跃次数加一，end 更新为 farthest。","因为题目保证可达，farthest 每次都会前进，不会死循环。数组长度为 1 时循环不执行，答案是 0。"],"traces":[{"input":"nums = [2,3,1,1,4]","output":"2","steps":["第一跳的边界是下标 0。在这一跳里能看到下标 1，它把下一跳的最远位置推到 4。","走到当前边界 0，必须起跳，步数变成 1，新边界变成 4。","下标 1 到 3 都还在这一跳里面。走到边界前，末尾已经被覆盖。再起跳一次，步数变成 2，到达终点。"],"figure":{"kind":"array","caption":"第一跳看向下标 1，第二跳就能到终点","values":[2,3,1,1,4],"on":[0],"alt":[1],"hot":[4],"labels":{"0":"第 1 跳","1":"第 2 跳"}}},{"input":"nums = [2,3,0,1,4]","output":"2","steps":["第一跳从 0 看到下标 1，下一跳最远仍是 4。走到下标 0 的边界就起跳。","第二跳的覆盖范围直接包含最后一个下标，不需要因为中间有 0 而多跳。最少仍是 2 跳。"]}],"complexity":{"time":"O(n)","space":"O(1)"},"go":"func jump(nums []int) int {\n  end, farthest, steps := 0, 0, 0\n  for i := 0; i \u003c len(nums)-1; i++ {\n    if i+nums[i] > farthest {\n      farthest = i + nums[i]\n    }\n    if i == end {\n      steps++\n      end = farthest\n    }\n  }\n  return steps\n}","ts":"function jump(nums: number[]): number {\n  let end = 0;\n  let farthest = 0;\n  let steps = 0;\n  for (let i = 0; i \u003c nums.length - 1; i += 1) {\n    farthest = Math.max(farthest, i + nums[i]);\n    if (i === end) {\n      steps += 1;\n      end = farthest;\n    }\n  }\n  return steps;\n}"},{"id":763,"title":"划分字母区间","en":"Partition Labels","slug":"partition-labels","difficulty":"medium","category":"贪心","tags":["贪心","字符串"],"summary":"每个片段必须延伸到片段内每个字母的最后一次出现位置。","description":["给定字符串 s。把 s 划分成尽可能多的片段，使同一字母最多只出现在一个片段里。","返回每个片段的长度列表。"],"examples":[{"input":"s = \"ababcbacadefegdehijhklij\"","output":"[9,7,8]"},{"input":"s = \"eccbbbbdec\"","output":"[10]"}],"constraints":["1 \u003c= s.length \u003c= 500","s 仅由小写英文字母组成"],"essence":[{"title":"最后出现位置","body":"先记录每个字母最后出现的下标。片段的右端至少要覆盖片段里每个字母的最后位置。"},{"title":"走到右端就切开","body":"当前下标追上这一段记录的最远位置时，这一段可以结束。"},{"title":"复杂度","body":"两趟扫描，时间 O(n)，字母表大小固定。"}],"solution":["第一趟记录 26 个字母的最后下标。","第二趟维护当前片段的起点和必须到达的最远下标。每看到一个字符，就把最远下标更新为它的最后出现位置。","当遍历下标等于这个最远下标时，片段内所有字母都不会再出现在后面，记录长度并开始下一段。"],"traces":[{"input":"s = \"ababcbacadefegdehijhklij\"","output":"[9,7,8]","steps":["a 最后出现在下标 8，b 在 5，c 在 7。第一段从 0 开始，最远必须伸到 8。","走到下标 8 时，这段里的字母都不会再出现。切出长度 9。","下一段从 d 到 e 的最后位置，长度 7。最后 `hijhklij` 的字母都收在段内，长度 8。"],"figure":{"kind":"window","caption":"第一段必须延伸到 a 的最后一次出现","text":"ababcbaca","ranges":[[0,8]]}},{"input":"s = \"eccbbbbdec\"","output":"[10]","steps":["e 的最后位置是 8，c 的最后位置是 9。第一段的右端被不断推到字符串末尾，中间不能切开。只有一段，长度 10。","某个字母的最后位置如果在字符串末尾，当前段的右端就会被推到最后，前面不能提前切开。"]}],"complexity":{"time":"O(n)","space":"O(1)"},"go":"func partitionLabels(s string) []int {\n  last := [26]int{}\n  for i := 0; i \u003c len(s); i++ {\n    last[s[i]-'a'] = i\n  }\n  ans := make([]int, 0)\n  start, end := 0, 0\n  for i := 0; i \u003c len(s); i++ {\n    if last[s[i]-'a'] > end {\n      end = last[s[i]-'a']\n    }\n    if i == end {\n      ans = append(ans, end-start+1)\n      start = i + 1\n    }\n  }\n  return ans\n}","ts":"function partitionLabels(s: string): number[] {\n  const last = new Array\u003cnumber>(26).fill(0);\n  for (let i = 0; i \u003c s.length; i += 1) {\n    last[s.charCodeAt(i) - 97] = i;\n  }\n  const ans: number[] = [];\n  let start = 0;\n  let end = 0;\n  for (let i = 0; i \u003c s.length; i += 1) {\n    end = Math.max(end, last[s.charCodeAt(i) - 97]);\n    if (i === end) {\n      ans.push(end - start + 1);\n      start = i + 1;\n    }\n  }\n  return ans;\n}"},{"id":70,"title":"爬楼梯","en":"Climbing Stairs","slug":"climbing-stairs","difficulty":"easy","category":"动态规划","tags":["动态规划"],"summary":"到第 n 阶的方法数等于到第 n-1 阶加上到第 n-2 阶。","description":["假设每次可以爬 1 阶或 2 阶，计算爬到 n 阶有多少种不同的方法。","顺序不同视为不同方法。"],"examples":[{"input":"n = 2","output":"2","note":"1+1，或者一次爬 2 阶。"},{"input":"n = 3","output":"3"}],"constraints":["1 \u003c= n \u003c= 45"],"essence":[{"title":"斐波那契","body":"dp[n] = dp[n-1] + dp[n-2]，dp[1] = 1，dp[2] = 2。"},{"title":"滚动变量","body":"只依赖前两项，不必保存整个数组。"},{"title":"复杂度","body":"时间 O(n)，空间 O(1)。"}],"solution":["最后一步如果爬 1 阶，前面的走法是爬到 n-1 的走法；如果爬 2 阶，前面是爬到 n-2 的走法。两类走法没有重叠。","用两个变量滚动即可。n 为 1 或 2 时直接返回 n。","n 最大 45，答案仍在 32 位整数范围内。"],"traces":[{"input":"n = 5","output":"8","steps":["到第 1 阶只有 1 种，到第 2 阶有 2 种：1+1 或直接 2。","第 3 阶可以最后走 1 步，也可以最后走 2 步，方法数是 `1+2=3`。","第 4 阶是 `2+3=5`，第 5 阶是 `3+5=8`。每次只保留前两阶的结果。"],"figure":{"kind":"chips","caption":"到第 3 阶：三步 1，或者 1+2，或者 2+1","groups":[["1+1+1"],["1+2"],["2+1"]]}},{"input":"n = 3","output":"3","steps":["三种走法是 `1+1+1`、`1+2`、`2+1`。最后一步不同，前面的走法不会重复计数。","最后走 1 步的走法有 2 种，最后走 2 步的走法有 1 种。两类的终点步长不同，不会重复。"]}],"complexity":{"time":"O(n)","space":"O(1)"},"go":"func climbStairs(n int) int {\n  if n \u003c= 2 {\n    return n\n  }\n  a, b := 1, 2\n  for i := 3; i \u003c= n; i++ {\n    a, b = b, a+b\n  }\n  return b\n}","ts":"function climbStairs(n: number): number {\n  if (n \u003c= 2) {\n    return n;\n  }\n  let a = 1;\n  let b = 2;\n  for (let i = 3; i \u003c= n; i += 1) {\n    const next = a + b;\n    a = b;\n    b = next;\n  }\n  return b;\n}"},{"id":118,"title":"杨辉三角","en":"Pascal's Triangle","slug":"pascals-triangle","difficulty":"easy","category":"动态规划","tags":["动态规划"],"summary":"每一行的两端是 1，中间每个数等于上一行相邻两数之和。","description":["给定整数 numRows，返回杨辉三角的前 numRows 行。","在杨辉三角中，每行的首尾都是 1，其余位置是上一行左上和右上两个数的和。"],"examples":[{"input":"numRows = 5","output":"[[1],[1,1],[1,2,1],[1,3,3,1],[1,4,6,4,1]]"},{"input":"numRows = 1","output":"[[1]]"}],"constraints":["1 \u003c= numRows \u003c= 30"],"essence":[{"title":"只依赖上一行","body":"第 i 行第 j 个数等于上一行第 j-1 个数加第 j 个数。两端单独写成 1。"},{"title":"下标","body":"行和列都从 0 开始时，第 i 行有 i+1 个数。"},{"title":"复杂度","body":"总元素数是 O(numRows^2)，每个元素计算一次。"}],"solution":["逐行生成。新行先创建好长度，把首尾设为 1。","中间位置用上一行的相邻元素求和。只有一行时，首尾是同一个位置，赋一次 1 即可。","numRows 不超过 30，数值不会超出普通整数的安全范围。"],"traces":[{"input":"numRows = 5","output":"[[1],[1,1],[1,2,1],[1,3,3,1],[1,4,6,4,1]]","steps":["第 1 行只有一个 1。第 2 行两端都是 1。","第 3 行中间是上一行两个 1 相加，得到 2。","第 4 行中间两个数是 `1+2=3` 和 `2+1=3`。第 5 行是 `1+3=4`、`3+3=6`、`3+1=4`。","每一行都只使用上一行，两端固定为 1。"],"figure":{"kind":"grid","caption":"中间的数等于上一行相邻两数之和","rows":[[1],[1,1],[1,2,1],[1,3,3,1]],"on":[[3,1],[3,2]]}},{"input":"numRows = 1","output":"[[1]]","steps":["只有一行时，首尾是同一个格子，写成 1。没有中间元素需要求和。","行里只有一个格子，它既是左端也是右端，写成 1。中间的求和循环不会执行。"]}],"complexity":{"time":"O(numRows^2)","space":"O(1)"},"go":"func generate(numRows int) [][]int {\n  ans := make([][]int, numRows)\n  for i := 0; i \u003c numRows; i++ {\n    row := make([]int, i+1)\n    row[0], row[i] = 1, 1\n    for j := 1; j \u003c i; j++ {\n      row[j] = ans[i-1][j-1] + ans[i-1][j]\n    }\n    ans[i] = row\n  }\n  return ans\n}","ts":"function generate(numRows: number): number[][] {\n  const ans: number[][] = [];\n  for (let i = 0; i \u003c numRows; i += 1) {\n    const row = new Array\u003cnumber>(i + 1).fill(1);\n    for (let j = 1; j \u003c i; j += 1) {\n      row[j] = ans[i - 1][j - 1] + ans[i - 1][j];\n    }\n    ans.push(row);\n  }\n  return ans;\n}"},{"id":198,"title":"打家劫舍","en":"House Robber","slug":"house-robber","difficulty":"medium","category":"动态规划","tags":["动态规划"],"summary":"偷当前房子就不能偷上一间。每间房子在“偷”和“不偷”里取较大值。","description":["你是一个小偷，沿街有一排房屋，每间房屋存放着一定现金。相邻的房屋装有防盗系统，同一晚不能偷相邻的两间。","给定每间房屋的现金，返回今晚能偷到的最高金额。"],"examples":[{"input":"nums = [1,2,3,1]","output":"4","note":"偷第 1 间和第 3 间。"},{"input":"nums = [2,7,9,3,1]","output":"12"}],"constraints":["1 \u003c= nums.length \u003c= 100","0 \u003c= nums[i] \u003c= 400"],"essence":[{"title":"两种状态","body":"到第 i 间为止的最大金额，等于不偷第 i 间的旧答案，或偷第 i 间加上隔一间的答案。"},{"title":"两个滚动值","body":"prev2 是上上间结束时的最优，prev1 是上一间结束时的最优。"},{"title":"复杂度","body":"时间 O(n)，空间 O(1)。"}],"solution":["设 prev1 为考虑完上一间房子后的最大金额，prev2 为再上一间的结果。","对于当前房子，新的最优是 max(prev1, prev2+nums[i])。然后 prev2、prev1 向前滚动。","只有一间房子时，循环一次得到这间房子的金额。房屋现金非负，不需要考虑偷了反而更少的负值。"],"traces":[{"input":"nums = [2,7,9,3,1]","output":"12","steps":["第 1 间只能偷 2。第 2 间偷 7 比保留 2 更好，当前最优 7。","第 3 间如果偷，就是 `2+9=11`，比不偷的 7 更好。","第 4 间偷的话是 `7+3=10`，不如 11。第 5 间是 `11+1=12`，比 11 更好。","答案 12，对应第 1、3、5 间，它们互不相邻。"],"figure":{"kind":"array","caption":"偷 2、9、1，相邻的房子都跳过","values":[2,7,9,3,1],"on":[0,2,4],"alt":[1,3]}},{"input":"nums = [1,2,3,1]","output":"4","steps":["偷第 1 间和第 3 间得到 `1+3=4`。偷第 2 间和第 4 间得到 `2+1=3`。相邻的房子没有同时被选中，较大值是 4。","第 1 间和第 3 间不相邻，可以同时偷。第 2 间和第 4 间也可以，但金额更小。"]}],"complexity":{"time":"O(n)","space":"O(1)"},"go":"func rob(nums []int) int {\n  prev2, prev1 := 0, 0\n  for _, money := range nums {\n    prev2, prev1 = prev1, max(prev1, prev2+money)\n  }\n  return prev1\n}","ts":"function rob(nums: number[]): number {\n  let prev2 = 0;\n  let prev1 = 0;\n  for (const money of nums) {\n    const cur = Math.max(prev1, prev2 + money);\n    prev2 = prev1;\n    prev1 = cur;\n  }\n  return prev1;\n}"},{"id":279,"title":"完全平方数","en":"Perfect Squares","slug":"perfect-squares","difficulty":"medium","category":"动态规划","tags":["动态规划","广度优先搜索"],"summary":"完全平方数可以重复使用。dp[i] 是从 i 减去某个平方数后再加一次。","description":["给定正整数 n，找出若干个完全平方数，使它们的和等于 n，并返回这些完全平方数的最少个数。","完全平方数指 1、4、9、16 这种整数的平方。同一个平方数可以使用多次。"],"examples":[{"input":"n = 12","output":"3","note":"4+4+4。"},{"input":"n = 13","output":"2","note":"4+9。"}],"constraints":["1 \u003c= n \u003c= 10^4"],"essence":[{"title":"完全背包","body":"物品是所有不超过 n 的平方数，每个可以选无限次，目标是凑出 n 的最少件数。"},{"title":"转移","body":"dp[i] = min(dp[i-j*j]) + 1，j 从 1 到 sqrt(i)。"},{"title":"复杂度","body":"状态 n 个，每个状态最多试 sqrt(n) 个平方数，时间 O(n√n)。"}],"solution":["dp[i] 表示凑出 i 的最少平方数个数。dp[0] 是 0，其余先设为 i，因为最差可以全部用 1。","对于每个 i，枚举平方数 j*j。如果 dp[i-j*j]+1 更小，就更新 dp[i]。","也可以把每个余数看成图的节点，从 n 出发每次减去一个平方数，广度优先第一次到达 0 的层数就是答案。两者本质相同。"],"traces":[{"input":"n = 12","output":"3","steps":["1 可以拆成一个 1。2 是两个 1，3 是三个 1。4 可以直接用一个平方数，个数变成 1。","12 可以减掉 4，剩下 8。8 最少还要两个平方数，所以 12 这一路是 3。","12 减 9 剩 3，3 自己也要三个 1，总数是 4，更差。","最少是 3，也就是 `4+4+4`。"],"figure":{"kind":"chips","caption":"12 = 4 + 4 + 4，用了 3 个平方数","groups":[["4","4","4"]]}},{"input":"n = 13","output":"2","steps":["13 减 4 剩 9。9 本身是平方数，只需要再加 1 个。总共 2 个：`4+9`。这比全用 1 少得多。","枚举平方数时，13 减 4 剩下的 9 正好是另一个平方数，所以次数是 2，而不是 13 个 1。"],"figure":{"kind":"chips","caption":"13 = 4 + 9","groups":[["4","9"]]}}],"complexity":{"time":"O(n√n)","space":"O(n)"},"go":"func numSquares(n int) int {\n  dp := make([]int, n+1)\n  for i := 1; i \u003c= n; i++ {\n    dp[i] = i\n    for j := 1; j*j \u003c= i; j++ {\n      if dp[i-j*j]+1 \u003c dp[i] {\n        dp[i] = dp[i-j*j] + 1\n      }\n    }\n  }\n  return dp[n]\n}","ts":"function numSquares(n: number): number {\n  const dp = new Array\u003cnumber>(n + 1).fill(0);\n  for (let i = 1; i \u003c= n; i += 1) {\n    dp[i] = i;\n    for (let j = 1; j * j \u003c= i; j += 1) {\n      dp[i] = Math.min(dp[i], dp[i - j * j] + 1);\n    }\n  }\n  return dp[n];\n}"},{"id":322,"title":"零钱兑换","en":"Coin Change","slug":"coin-change","difficulty":"medium","category":"动态规划","tags":["动态规划","完全背包"],"summary":"每种硬币可以无限使用。凑不出金额时返回 -1。","description":["给定不同面额的硬币 coins 和一个总金额 amount。计算凑成总金额所需的最少硬币个数。","如果没有任何组合能够凑成，返回 -1。硬币数量不限，同一种硬币可以使用多次。"],"examples":[{"input":"coins = [1,2,5], amount = 11","output":"3","note":"5+5+1。"},{"input":"coins = [2], amount = 3","output":"-1"},{"input":"coins = [1], amount = 0","output":"0"}],"constraints":["1 \u003c= coins.length \u003c= 12","1 \u003c= coins[i] \u003c= 2^31 - 1","0 \u003c= amount \u003c= 10^4"],"essence":[{"title":"完全背包求最少件数","body":"dp[x] 表示凑出金额 x 的最少硬币数。枚举硬币时正序更新，表示硬币可以重复使用。"},{"title":"初始值","body":"dp[0] = 0。其余设成 amount+1，这个值比任何合法硬币数都大，最后仍大于 amount 就说明凑不出。"},{"title":"复杂度","body":"时间 O(amount·硬币数)，空间 O(amount)。"}],"solution":["对每个硬币，把金额从该硬币面额遍历到 amount。转移是 dp[x] = min(dp[x], dp[x-coin]+1)。","正序遍历金额是因为使用了一枚硬币后，剩下的金额仍然可以使用同一枚硬币。如果倒序，就变成每种硬币最多一枚。","amount 为 0 时不进入循环，直接返回 0。"],"traces":[{"input":"coins = [1,2,5], amount = 11","output":"3","steps":["dp[0] 是 0。用硬币 1 可以把每个金额的个数设成金额本身。","硬币 2 把偶数金额减半。例如 4 变成 2 枚，6 变成 3 枚。","硬币 5 再更新：10 可以用两枚 5，11 可以用两枚 5 再加一枚 1，个数是 3。","金额从硬币面额向后更新，所以同一枚硬币可以重复使用。"],"figure":{"kind":"chips","caption":"11 = 5 + 5 + 1","groups":[["5","5","1"]]}},{"input":"coins = [2], amount = 3","output":"-1","steps":["2 只能更新偶数金额。dp[3] 一直是初始的无效值，比金额 3 还大，返回 -1。金额 0 则一开始就是 0，不用硬币。","硬币 2 只能更新 2 的倍数。3 这个位置从未被改成合法个数，最后判定为凑不出。"]}],"complexity":{"time":"O(amount·k)","space":"O(amount)"},"go":"func coinChange(coins []int, amount int) int {\n  dp := make([]int, amount+1)\n  for i := 1; i \u003c= amount; i++ {\n    dp[i] = amount + 1\n  }\n  for _, coin := range coins {\n    for x := coin; x \u003c= amount; x++ {\n      if dp[x-coin]+1 \u003c dp[x] {\n        dp[x] = dp[x-coin] + 1\n      }\n    }\n  }\n  if dp[amount] > amount {\n    return -1\n  }\n  return dp[amount]\n}","ts":"function coinChange(coins: number[], amount: number): number {\n  const dp = new Array\u003cnumber>(amount + 1).fill(amount + 1);\n  dp[0] = 0;\n  for (const coin of coins) {\n    for (let x = coin; x \u003c= amount; x += 1) {\n      dp[x] = Math.min(dp[x], dp[x - coin] + 1);\n    }\n  }\n  return dp[amount] > amount ? -1 : dp[amount];\n}"},{"id":139,"title":"单词拆分","en":"Word Break","slug":"word-break","difficulty":"medium","category":"动态规划","tags":["动态规划","哈希表"],"summary":"dp[i] 表示前 i 个字符能否被词典拼出。只在 dp[j] 已经为真时检查 s[j:i]。","description":["给定字符串 s 和字符串列表 wordDict。判断 s 能否由词典中的单词拼接出来。","词典中的单词可以重复使用，拼接时不要求使用全部单词。"],"examples":[{"input":"s = \"leetcode\", wordDict = [\"leet\",\"code\"]","output":"true"},{"input":"s = \"applepenapple\", wordDict = [\"apple\",\"pen\"]","output":"true"},{"input":"s = \"catsandog\", wordDict = [\"cats\",\"dog\",\"sand\",\"and\",\"cat\"]","output":"false"}],"constraints":["1 \u003c= s.length \u003c= 300","1 \u003c= wordDict.length \u003c= 1000","1 \u003c= wordDict[i].length \u003c= 20","s 和 wordDict[i] 只由小写英文字母组成","wordDict 中的字符串互不相同"],"essence":[{"title":"前缀可拆","body":"如果前 j 个字符可拆，并且 s[j:i] 在词典里，那么前 i 个字符可拆。"},{"title":"限制单词长度","body":"j 只需要从 i 往回看最长单词那么远，避免无意义的切片。"},{"title":"复杂度","body":"s 长度 300，时间大约 O(n^2)，再乘词典查询。哈希集合查询是常数。"}],"solution":["把词典放进哈希集合，并记录最长单词长度。dp[0] 为真，表示空前缀可以拆。","枚举结尾 i。对每个可能的起点 j，如果 dp[j] 为真且子串在词典中，就把 dp[i] 设为真并停止这一层。","最后返回 dp[n]。\"applepenapple\" 中 apple 被使用两次，集合并不消耗单词，所以允许重复使用。"],"traces":[{"input":"s = \"leetcode\", wordDict = [\"leet\",\"code\"]","output":"true","steps":["空前缀可以拆。扫描到下标 4，子串 `leet` 在词典里，前 4 个字符标记为可拆。","再从下标 4 看到末尾，子串 `code` 也在词典里，而且起点是可拆的。整个字符串可拆。","applepenapple 里 apple 用了两次。词典是集合，单词不会被用掉。"],"figure":{"kind":"window","caption":"leet 和 code 都在词典里，并且首尾相接","text":"leetcode","ranges":[[0,3],[4,7]]}},{"input":"s = \"catsandog\", wordDict = [\"cats\",\"dog\",\"sand\",\"and\",\"cat\"]","output":"false","steps":["`cat` 和 `cats` 都能作为开头。后面的 `sand` 也能接上某些前缀。","但走到末尾时，没有任何一个可拆前缀加上词典单词正好覆盖 `catsandog`。dp 最后一位仍是 false。"]}],"complexity":{"time":"O(n^2)","space":"O(n)"},"go":"func wordBreak(s string, wordDict []string) bool {\n  wordSet := map[string]bool{}\n  maxLen := 0\n  for _, word := range wordDict {\n    wordSet[word] = true\n    if len(word) > maxLen {\n      maxLen = len(word)\n    }\n  }\n  n := len(s)\n  dp := make([]bool, n+1)\n  dp[0] = true\n  for i := 1; i \u003c= n; i++ {\n    for j := i - 1; j >= 0 && i-j \u003c= maxLen; j-- {\n      if dp[j] && wordSet[s[j:i]] {\n        dp[i] = true\n        break\n      }\n    }\n  }\n  return dp[n]\n}","ts":"function wordBreak(s: string, wordDict: string[]): boolean {\n  const wordSet = new Set(wordDict);\n  let maxLen = 0;\n  for (const word of wordDict) {\n    maxLen = Math.max(maxLen, word.length);\n  }\n  const dp = new Array\u003cboolean>(s.length + 1).fill(false);\n  dp[0] = true;\n  for (let i = 1; i \u003c= s.length; i += 1) {\n    for (let j = i - 1; j >= 0 && i - j \u003c= maxLen; j -= 1) {\n      if (dp[j] && wordSet.has(s.slice(j, i))) {\n        dp[i] = true;\n        break;\n      }\n    }\n  }\n  return dp[s.length];\n}"},{"id":300,"title":"最长递增子序列","en":"Longest Increasing Subsequence","slug":"longest-increasing-subsequence","difficulty":"medium","category":"动态规划","tags":["动态规划","二分查找"],"summary":"tails[i] 保存长度为 i+1 的递增子序列里最小的结尾。新数字用二分找第一个不小于它的位置。","description":["给定整数数组 nums，找出其中严格递增子序列的最大长度。子序列不要求连续。"],"examples":[{"input":"nums = [10,9,2,5,3,7,101,18]","output":"4","note":"其中一条是 2,3,7,101。"},{"input":"nums = [0,1,0,3,2,3]","output":"4"},{"input":"nums = [7,7,7,7]","output":"1"}],"constraints":["1 \u003c= nums.length \u003c= 2500","-10^4 \u003c= nums[i] \u003c= 10^4"],"essence":[{"title":"tails 的含义","body":"tails 本身递增。它保存的是各长度递增子序列的最小结尾，不是某一条真实子序列。"},{"title":"二分替换","body":"找到第一个大于等于 x 的结尾并替换。如果 x 比所有结尾都大，就接到末尾，长度加一。"},{"title":"复杂度","body":"朴素 DP 是 O(n^2)。耐心排序是 O(n log n)。"}],"solution":["dp[i] 表示以 i 结尾的最长递增子序列长度，转移要看前面所有更小的数，时间是平方。","更高效的做法维护 tails。扫描每个 x，在 tails 中二分第一个大于等于 x 的位置。替换它不会使已有长度失效，因为新的结尾更小，后面更容易接上。","如果 x 大于所有结尾，tails 增长。最终 tails 的长度就是答案。严格递增要用“大于等于”的下界；非降序才改成“大于”。"],"traces":[{"input":"nums = [10,9,2,5,3,7,101,18]","output":"4","steps":["tails 保存每种长度的最小结尾。10 进来，tails 是 `[10]`。9 比 10 小，替换成 `[9]`。2 再替换成 `[2]`。","5 比 2 大，接到后面，变成 `[2,5]`。3 替换 5，变成 `[2,3]`。长度没有变，但结尾更小，后面更容易接。","7 接到 3 后面，101 再接上，tails 变成 `[2,3,7,101]`。","18 替换 101。最终长度仍是 4。tails 不是某一条真实子序列，它只负责记录最小结尾。"],"figure":{"kind":"array","caption":"tails 只保留每个长度的最小结尾","values":[2,3,7,18],"on":[0,1,2,3],"labels":{"0":"长 1","1":"长 2","2":"长 3","3":"长 4"}}},{"input":"nums = [7,7,7,7]","output":"1","steps":["严格递增不能接相同的数。后面的每个 7 都找到第一个大于等于自己的位置，也就是下标 0，把结尾继续换成 7。","数组长度始终是 1。如果题目改成非严格递增，这里才会把相等的数接长。"]}],"complexity":{"time":"O(n log n)","space":"O(n)"},"go":"func lengthOfLIS(nums []int) int {\n  tails := make([]int, 0)\n  for _, x := range nums {\n    i := sort.Search(len(tails), func(i int) bool { return tails[i] >= x })\n    if i == len(tails) {\n      tails = append(tails, x)\n    } else {\n      tails[i] = x\n    }\n  }\n  return len(tails)\n}","ts":"function lengthOfLIS(nums: number[]): number {\n  const tails: number[] = [];\n  for (const value of nums) {\n    let left = 0;\n    let right = tails.length;\n    while (left \u003c right) {\n      const mid = (left + right) >> 1;\n      if (tails[mid] \u003c value) {\n        left = mid + 1;\n      } else {\n        right = mid;\n      }\n    }\n
